<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Billing &amp; Trust Manager</title>
<style>
  :root{
    /* CM Advisory Corp brand palette */
    --emerald:#0F5A43; --forest:#0A3B2D; --ink:#16211C; --gold:#C2A15A;
    --paper:#F7F6F1; --stone:#6E7A75;
    --bg:#f1f3f2; --panel:#ffffff; --muted:#6E7A75;
    --line:#e2e5e2; --accent:#0F5A43; --accent2:#0A3B2D; --accent-soft:#e7f0ec;
    --good:#0F5A43; --good-soft:#e7f0ec; --warn:#8a6d00; --warn-soft:#fbf3dc;
    --bad:#a8321f; --bad-soft:#fbeae7; --nc:#7a4fb5; --nc-soft:#f2ecfa;
    --radius:8px; --shadow:0 1px 3px rgba(16,33,28,.08),0 1px 2px rgba(16,33,28,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;}
  h1,h2,h3,h4{margin:0 0 .4em; font-weight:600; line-height:1.25;}
  a{color:var(--accent2);}
  button{font-family:inherit; font-size:13px; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:13px; color:var(--ink);
    padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:#fff; width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft); border-color:var(--accent2);}
  textarea{resize:vertical; min-height:60px;}
  label{display:block; font-size:12px; color:var(--muted); margin:0 0 3px; font-weight:500;}
  .btn{background:var(--accent); color:#fff; border:1px solid var(--accent); padding:8px 14px;
    border-radius:6px; font-weight:500;}
  .btn:hover{background:var(--accent2);}
  .btn.sec{background:#fff; color:var(--accent); border-color:var(--line);}
  .btn.sec:hover{border-color:var(--accent2); background:var(--accent-soft);}
  .btn.ghost{background:transparent; color:var(--muted); border-color:transparent; padding:5px 8px;}
  .btn.ghost:hover{color:var(--ink); background:#eef0f3;}
  .btn.danger{background:#fff; color:var(--bad); border-color:var(--line);}
  .btn.danger:hover{background:var(--bad-soft); border-color:var(--bad);}
  .btn.sm{padding:5px 9px; font-size:12px;}
  .tag{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600; white-space:nowrap;}
  .tag.good{background:var(--good-soft); color:var(--good);}
  .tag.warn{background:var(--warn-soft); color:var(--warn);}
  .tag.bad{background:var(--bad-soft); color:var(--bad);}
  .tag.nc{background:var(--nc-soft); color:var(--nc);}
  .tag.info{background:var(--accent-soft); color:var(--accent);}
  .tag.gray{background:#eceef1; color:var(--muted);}

  /* Layout */
  #app{display:flex; min-height:100vh;}
  #side{width:222px; background:linear-gradient(180deg,#0F5A43,#0A3B2D); color:#cfe0d8; flex:0 0 222px; padding:0; position:sticky; top:0; height:100vh; overflow:auto;}
  #side .brand{padding:18px 18px 14px; border-bottom:1px solid rgba(255,255,255,.10); display:flex; align-items:center; gap:10px;}
  #side .brand .mono{width:34px; height:34px; border-radius:8px; background:#0A3B2D; color:var(--paper); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; letter-spacing:.02em; border-bottom:2px solid var(--gold);}
  #side .brand b{color:#fff; font-size:14px; display:block; line-height:1.15;}
  #side .brand span{font-size:10.5px; color:var(--gold); letter-spacing:.06em; text-transform:uppercase;}
  #side nav{padding:10px 0;}
  #side nav a{display:flex; align-items:center; gap:10px; padding:10px 18px; color:#cfe0d8; text-decoration:none; font-size:13.5px; cursor:pointer; border-left:3px solid transparent;}
  #side nav a:hover{background:rgba(255,255,255,.06); color:#fff;}
  #side nav a.active{background:rgba(194,161,90,.16); color:#fff; border-left-color:var(--gold); font-weight:600;}
  #side nav a .ic{width:18px; text-align:center; opacity:.85;}
  #main{flex:1; min-width:0; padding:24px 30px 60px; max-width:1180px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px; flex-wrap:wrap;}
  .topbar h1{font-size:22px; margin:0;}
  .topbar .sub{color:var(--muted); font-size:12.5px;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:18px;}
  .card h3{font-size:15px; display:flex; align-items:center; gap:8px; justify-content:space-between;}
  .card h3 .r{font-weight:400;}
  .grid{display:grid; gap:12px;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:1fr 1fr 1fr;}
  .g4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr;}}
  .row{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .right{text-align:right;}
  .center{text-align:center;}
  .nowrap{white-space:nowrap;}
  .spacer{flex:1;}
  .hr{height:1px; background:var(--line); margin:14px 0; border:0;}
  .pill-row{display:flex; gap:8px; flex-wrap:wrap;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:2px solid var(--line);}
  td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafbfc;}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .empty{padding:30px; text-align:center; color:var(--muted); font-style:italic;}

  .stat{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
  .stat .k{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600;}
  .stat .v{font-size:22px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums;}
  .stat .v.small{font-size:16px;}

  /* Modal */
  .modal-bg{position:fixed; inset:0; background:rgba(15,25,40,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:100; overflow:auto;}
  .modal{background:#fff; border-radius:10px; width:100%; max-width:720px; box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden;}
  .modal.wide{max-width:920px;}
  .modal .mh{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .modal .mh h3{margin:0; font-size:16px;}
  .modal .mb{padding:20px; max-height:70vh; overflow:auto;}
  .modal .mf{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; background:#fafbfc;}
  .x{background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer; line-height:1;}

  .chk{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink);}
  .chk input{width:auto;}
  .fieldset{border:1px solid var(--line); border-radius:6px; padding:12px; margin-top:8px;}
  .fieldset legend{font-size:12px; color:var(--muted); font-weight:600; padding:0 6px;}
  .tier-row{display:grid; grid-template-columns:1.6fr .7fr 1.4fr auto auto; gap:8px; align-items:center; margin-bottom:8px;}
  @media(max-width:760px){.tier-row{grid-template-columns:1fr 1fr;}}

  .subhead{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; margin:18px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--line);}

  /* ===== Print document (invoice / statement / retainer) — CM Advisory brand ===== */
  #docwrap{background:#4a524e; padding:26px; display:none;}
  #docwrap.show{display:block;}
  .doc{background:#fff; max-width:8.5in; margin:0 auto 22px; padding:0.6in 0.65in; box-shadow:0 6px 26px rgba(0,0,0,.35);
    color:var(--ink); font-size:11.5px; line-height:1.5;
    font-family:'Poppins','Segoe UI',Helvetica,Arial,sans-serif;}
  .doc .lbl{color:var(--stone); font-size:9px; text-transform:uppercase; letter-spacing:.08em; font-weight:600;}
  .doc .doctitle{font-size:26px; letter-spacing:.06em; font-weight:600; color:var(--emerald); text-transform:uppercase; margin:0;}
  .doc h1,.doc h2,.doc h3{color:var(--emerald);}

  /* Masthead */
  .doc .lh{display:flex; justify-content:space-between; align-items:flex-start; gap:20px;}
  .doc .lh-logo{max-height:66px; max-width:260px;}
  .doc .lh-name{font-weight:700; color:var(--emerald); font-size:19px; line-height:1.1; letter-spacing:.01em;}
  .doc .lh-tag{color:var(--gold); font-size:9px; letter-spacing:.14em; text-transform:uppercase; margin-top:3px; font-weight:600;}
  .doc .lh-contact{font-size:10px; color:var(--stone); text-align:right; line-height:1.55;}
  .doc .lh-rule{border:none; border-top:2px solid var(--gold); margin:12px 0 0;}

  /* Meta / parties */
  .doc .meta{display:flex; justify-content:space-between; gap:24px; margin-top:20px;}
  .doc .party b{font-size:12.5px; color:var(--ink);}
  .doc .metatable{font-size:11px; min-width:220px;}
  .doc .metatable td{padding:2px 0; border:none;}
  .doc .metatable td:first-child{color:var(--stone); padding-right:16px;}
  .doc .metatable td:last-child{text-align:right; font-weight:500;}

  /* Amount-due summary band */
  .doc .summary{display:flex; margin:22px 0 6px; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .doc .summary .cell{flex:1; padding:12px 16px; border-right:1px solid var(--line);}
  .doc .summary .cell:last-child{border-right:none;}
  .doc .summary .cell.due{background:var(--emerald); color:#fff;}
  .doc .summary .cell.due .lbl,.doc .summary .cell.due .amt{color:#fff;}
  .doc .summary .lbl{margin-bottom:3px;}
  .doc .summary .amt{font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink);}

  /* Line-item tables */
  .doc table{font-size:11px; border-collapse:collapse; width:100%;}
  .doc thead th{text-align:left; font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--stone);
    font-weight:600; padding:7px 8px; border-bottom:1px solid var(--line);}
  .doc tbody td{padding:7px 8px; border-bottom:1px solid #eef0ee; vertical-align:top;}
  .doc td.num,.doc th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .doc .sec-title td{background:var(--emerald); color:#fff; font-weight:600; text-transform:uppercase;
    letter-spacing:.06em; font-size:10px; padding:7px 10px; border:none;}
  .doc .subtot td{border-top:1px solid var(--gold); border-bottom:none; padding-top:7px; font-weight:600; color:var(--ink);}
  .doc .nc{color:var(--nc); font-style:italic;}
  .doc .muted{color:var(--stone);}

  /* Totals block */
  .doc .totals{width:290px; margin-left:auto; margin-top:14px;}
  .doc .totals td{padding:3px 2px; border:none; font-size:11px;}
  .doc .totals td:last-child{text-align:right; font-variant-numeric:tabular-nums;}
  .doc .totals tr.disc td{color:var(--emerald);}
  .doc .totals tr.rule td{border-top:1px solid var(--line); padding-top:6px;}
  .doc .totals tr.grand td{border-top:2px solid var(--emerald); font-weight:700; font-size:13.5px; padding-top:7px; color:var(--emerald);}
  .doc .totals tr.bal td{font-weight:700; font-size:13.5px; color:var(--ink);}

  /* Notes */
  .doc .note{font-size:10px; color:#3c463f; background:var(--paper); border:1px solid #e6e3d9; border-left:3px solid var(--gold);
    border-radius:5px; padding:9px 12px; margin-top:14px;}
  .doc .note b{color:var(--emerald);}
  .doc .note table td{border:none; padding:3px 8px; font-size:9.5px;}
  .doc .note table th{color:var(--stone); border-bottom:1px solid #e6e3d9; padding:3px 8px;}
  .doc .sig{margin-top:38px;}

  /* Remittance stub */
  .doc .stub{margin-top:26px; border-top:1.5px dashed var(--gold); padding-top:6px;}
  .doc .stub .cut{font-size:8.5px; color:var(--stone); letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px;}
  .doc .stub .row2{display:flex; justify-content:space-between; align-items:flex-end; gap:20px;}
  .doc .stub .box{border:1px solid var(--line); border-radius:6px; padding:8px 12px; min-width:150px;}

  .docbar{position:sticky; top:0; background:var(--forest); padding:10px 16px; display:flex; gap:10px; align-items:center; margin:-26px -26px 26px; z-index:5;}
  .docbar .btn{background:var(--gold); color:var(--forest); border-color:var(--gold); font-weight:600;}
  .docbar .btn:hover{background:#d0b673;}
  .docbar .btn.sec{background:transparent; border-color:rgba(255,255,255,.3); color:#eaf0ec;}
  @media print{
    body{background:#fff;}
    #side,#main,.docbar,.noprint{display:none !important;}
    #docwrap{display:block !important; background:#fff; padding:0;}
    .doc{box-shadow:none; margin:0; max-width:none; padding:0.5in 0.55in; page-break-after:always;}
    .doc:last-child{page-break-after:auto;}
    .doc .sec-title td,.doc .summary .cell.due{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><div class="mono">CM</div><div><b id="brandName">CM Advisory Corp</b><span id="brandSub">Billing &amp; Trust</span></div></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>

<div id="docwrap"></div>
<div id="modalHost"></div>

let DB = load();

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){ console.warn('load failed', e); }
  return seed();
}

/* Fill in newly-added fields and apply the firm letterhead once. */
function migrate(db){
  const f = db.firm || (db.firm = {});
  if(f.fax === undefined) f.fax = '';
  if(f.website === undefined) f.website = '';
  if(f.logo === undefined) f.logo = '';
  if(f.tagline === undefined) f.tagline = BRAND_TAGLINE;
  if(!f._letterhead){
    // Apply CM Advisory Corp letterhead (from the firm's letterhead document).
    f.name = 'CM Advisory Corp';
    f.line1 = '7457 Franklin Road, Suite 250';
    f.city = 'Bloomfield Hills'; f.state = 'Michigan'; f.zip = '48301';
    f.phone = '(248) 765-5427'; f.fax = '(248) 859-2985';
    f.website = '';
    f._letterhead = 'cm';
  }
  // Install the brand lockup once (users can replace or remove it in Settings).
  if(!f._brandLogo){
    if(!f.logo || f.logo === '') f.logo = BRAND_LOGO;
    f.tagline = f.tagline || BRAND_TAGLINE;
    f._brandLogo = 1;
  }
  return db;
}

/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const money = n => (n<0?'-$':'$') + Math.abs(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = n => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayISO = () => new Date().toISOString().slice(0,10);
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${m}/${d}/${y}`; }
function cityStateZip(city,state,zip){ const cs=[city,state].filter(Boolean).join(', '); return [cs,zip].filter(Boolean).join(' '); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function endOfMonth(iso){ const d=new Date(iso+'T00:00:00'); const e=new Date(d.getFullYear(), d.getMonth()+1, 0); return e.toISOString().slice(0,10); }
function clientById(id){ return DB.clients.find(c=>c.id===id); }
function matterById(id){ return DB.matters.find(m=>m.id===id); }
function mattersFor(clientId){ return DB.matters.filter(m=>m.clientId===clientId); }
function tkById(id){ return DB.timekeepers.find(t=>t.id===id); }
function tkLabel(id){ const t=tkById(id); return t?`${t.name} (${t.initials})`:'—'; }

/* entry amount recompute */
function entryAmount(e){
  if(e.type==='hourly') return e.noCharge ? 0 : round2((Number(e.hours)||0)*(Number(e.rate)||0));
  return round2(Number(e.amount)||0);
}
function round2(n){ return Math.round((Number(n)||0)*100)/100; }

/* ---------- routing ---------- */
const TABS = [
  {id:'dashboard', label:'Dashboard', ic:'▚'},
  {id:'clients', label:'Clients & Matters', ic:'▤'},
  {id:'time', label:'Time & Fees', ic:'▦'},
  {id:'invoices', label:'Invoices', ic:'▧'},
  {id:'payments', label:'Payments', ic:'▨'},
  {id:'trust', label:'Retainers & Trust', ic:'▣'},
  {id:'statements', label:'Statements', ic:'▥'},
  {id:'settings', label:'Firm Settings', ic:'⚙'},
];

function render(){
  $('#brandName').textContent = DB.firm.name || 'Legal Billing';
  const nav = $('#nav');
  nav.innerHTML = TABS.map(t=>`<a data-tab="${t.id}" class="${DB.ui.tab===t.id?'active':''}"><span class="ic">${t.ic}</span>${t.label}</a>`).join('');
  nav.querySelectorAll('a').forEach(a=>a.onclick=()=>{ DB.ui.tab=a.dataset.tab; save(); render(); window.scrollTo(0,0); });
  const main = $('#main');
  hideDoc();
  ({dashboard:viewDashboard, clients:viewClients, time:viewTime, invoices:viewInvoices,
    payments:viewPayments, trust:viewTrust, statements:viewStatements, settings:viewSettings}[DB.ui.tab]||viewDashboard)(main);
}

   ========================================================================= */
function viewDashboard(main){
  const openInv = DB.invoices.filter(i=>i.status!=='paid'&&i.status!=='void');
  const arTotal = openInv.reduce((s,i)=>s+invoiceBalance(i),0);
  const trustTotal = DB.clients.reduce((s,c)=>s+trustBalance(c.id),0);
  const wipHourly = unbilledEntries().filter(e=>e.type==='hourly').reduce((s,e)=>s+entryAmount(e),0);
  const wipOther = unbilledEntries().filter(e=>e.type!=='hourly').reduce((s,e)=>s+entryAmount(e),0);

  main.innerHTML = `
    <div class="topbar"><div><h1>Dashboard</h1><div class="sub">${esc(DB.firm.name)} · ${fmtDate(todayISO())}</div></div></div>
    <div class="grid g4" style="margin-bottom:18px">
      <div class="stat"><div class="k">Accounts Receivable</div><div class="v">${money(arTotal)}</div><div class="small muted">${openInv.length} open invoice(s)</div></div>
      <div class="stat"><div class="k">Client Trust (IOLTA)</div><div class="v">${money(trustTotal)}</div><div class="small muted">across ${DB.clients.length} client(s)</div></div>
      <div class="stat"><div class="k">Unbilled Fees (WIP)</div><div class="v">${money(wipHourly)}</div><div class="small muted">hourly work in progress</div></div>
      <div class="stat"><div class="k">Unbilled Fixed/Costs</div><div class="v">${money(wipOther)}</div><div class="small muted">ready to invoice</div></div>
    </div>

    <div class="grid g2">
      <div class="card">
        <h3>Open Invoices <span class="r"><button class="btn sm" data-go="invoices">View all</button></span></h3>
        ${openInv.length? `<table><thead><tr><th>Invoice</th><th>Client</th><th class="num">Balance</th><th>Status</th></tr></thead><tbody>`+
          openInv.slice(0,8).map(i=>`<tr style="cursor:pointer" data-openinv="${i.id}"><td><b>${esc(i.number)}</b><br><span class="small muted">${fmtDate(i.date)}</span></td>
            <td>${esc(clientById(i.clientId)?.name||'—')}</td><td class="num">${money(invoiceBalance(i))}</td><td>${invStatusTag(i)}</td></tr>`).join('')+
          `</tbody></table>` : `<div class="empty">No open invoices.</div>`}
      </div>
      <div class="card">
        <h3>Trust Balances</h3>
        ${DB.clients.length? `<table><thead><tr><th>Client</th><th class="num">Trust Balance</th></tr></thead><tbody>`+
          DB.clients.map(c=>`<tr><td>${esc(c.name)}</td><td class="num ${trustBalance(c.id)<0?'':''}">${money(trustBalance(c.id))}</td></tr>`).join('')+
          `</tbody></table>` : `<div class="empty">No clients yet.</div>`}
        <div class="note small muted" style="margin-top:10px">${esc(DB.firm.trustNotice)}</div>
      </div>
    </div>

    <div class="card">
      <h3>Quick actions</h3>
      <div class="pill-row">
        <button class="btn" data-go="time">＋ Add time / fee entry</button>
        <button class="btn sec" data-go="invoices" id="qNewInv">＋ New invoice</button>
        <button class="btn sec" data-go="trust" id="qRetainer">＋ Retainer request</button>
        <button class="btn sec" data-go="clients">＋ New client / matter</button>
      </div>
    </div>`;
  main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ DB.ui.tab=b.dataset.go; save(); render(); });
  main.querySelectorAll('[data-openinv]').forEach(t=>t.onclick=()=>{ openInvoiceDoc(t.dataset.openinv); });
}

        ms.map(m=>{

function discountSummary(c){
  const d=c.discount||{type:'none'};
  if(d.type==='none') return `<span class="tag gray">No discount</span>`;
  if(d.type==='flat') return `<span class="tag info">Flat ${d.tiers?.[0]?.percent||0}% off ${d.appliesTo==='all'?'all fees':'hourly fees'}</span>`;
  const tiers=(d.tiers||[]).map(t=>`<span class="tag info">${t.percent}% – ${condLabel(t)}</span>`).join(' ');
  return `<span class="small muted">Tiered discount on ${d.appliesTo==='all'?'all fees':'hourly fees'}: </span>${tiers}`;
}
function condLabel(t){
  if(t.cond==='days') return `if paid in full within ${t.days} day(s) of invoice`;
  if(t.cond==='eom') return `if paid in full by end of invoice month`;
  if(t.cond==='date') return `if paid in full by ${fmtDate(t.byDate)}`;
  return 'always';
}

function invStatusTag(i){
  if(i.status==='void') return '<span class="tag gray">Void</span>';
  const bal=invoiceBalance(i);
  if(bal<=0.005) return '<span class="tag good">Paid</span>';
  if(invoicePaid(i)>0) return '<span class="tag warn">Partial</span>';
  return '<span class="tag bad">Open</span>';
}
/* Amount of a single payment applied to a given invoice (supports multi-invoice allocations). */
function paymentAppliedTo(p, invId){
  if(Array.isArray(p.allocations)) return round2(p.allocations.filter(a=>a.invoiceId===invId).reduce((s,a)=>s+(Number(a.amount)||0),0));
  return p.invoiceId===invId ? round2(p.amount) : 0;
}
function paymentApplied(p){
  if(Array.isArray(p.allocations)) return round2(p.allocations.reduce((s,a)=>s+(Number(a.amount)||0),0));
  return p.invoiceId ? round2(p.amount) : 0;
}
function paymentUnapplied(p){ return round2((Number(p.amount)||0) - paymentApplied(p)); }
function clientCredit(clientId){ return round2(DB.payments.filter(p=>p.clientId===clientId).reduce((s,p)=>s+paymentUnapplied(p),0)); }

function invoicePaid(i){
  const fromPay = DB.payments.reduce((s,p)=>s+paymentAppliedTo(p,i.id),0);
  const fromTrust = DB.trust.filter(t=>t.invoiceId===i.id&&t.type==='apply').reduce((s,t)=>s+t.amount,0);
  return round2(fromPay+fromTrust);
}
function invoiceBalance(i){ if(i.status==='void') return 0; return round2((i.grandTotal||0) - invoicePaid(i)); }
function openInvoicesFor(clientId){
  return DB.invoices.filter(i=>i.clientId===clientId && i.status!=='void' && invoiceBalance(i)>0.005)
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}

    }
    function drawEntries(){
      const w=$('#entryPick',body);
      const mids=[...sel.matterIds];
      if(!mids.length){ w.innerHTML=`<div class="small muted">Select at least one matter.</div>`; return; }
      const list=unbilledEntries().filter(e=>mids.includes(e.matterId)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      if(!list.length){ w.innerHTML=`<div class="small muted">No unbilled entries for the selected matter(s).</div>`; return; }
      // default select all
      list.forEach(e=>{ if(!sel._touched) sel.entryIds.add(e.id); });
      sel._touched=true;
      w.innerHTML=`<table><thead><tr><th><input type="checkbox" id="ckAll"></th><th>Date</th><th>Type</th><th>Description</th><th class="num">Amount</th></tr></thead><tbody>`+
        list.map(e=>`<tr><td><input type="checkbox" class="eck" value="${e.id}" ${sel.entryIds.has(e.id)?'checked':''}></td>
          <td class="nowrap">${fmtDate(e.date)}</td><td>${typeTag(e.type)}</td>
          <td>${esc(e.desc)} ${e.noCharge?'<span class="tag nc">No Charge</span>':''}</td>
          <td class="num">${e.noCharge?'$0.00':money(entryAmount(e))}</td></tr>`).join('')+`</tbody></table>`;
      w.querySelectorAll('.eck').forEach(ck=>ck.onchange=()=>{ ck.checked?sel.entryIds.add(ck.value):sel.entryIds.delete(ck.value); });

  }, ()=>{
    if(!sel.entryIds.size){ alert('Select at least one entry.'); return false; }
    createInvoice(sel);
    return true;
  }, null, 'Create Invoice');
}

function createInvoice(sel){
  const client=clientById(sel.clientId);
  const entryIds=[...sel.entryIds];
  const mids=[...new Set(entryIds.map(id=>DB.entries.find(e=>e.id===id).matterId))];
  const number = DB.firm.invoicePrefix + (DB.firm.nextInvoiceNo++);
  const inv={
    id:uid('inv'), number, clientId:sel.clientId, matterIds:mids,
    matterNames:mids.map(id=>matterById(id)?.name).filter(Boolean).join(', '),
    date:sel.date, dueDate:addDays(sel.date,30),
    entryIds,
    discountSnapshot: JSON.parse(JSON.stringify(client.discount||{type:'none'})),
    discountOverride:{mode:'auto', tierId:'', customPct:0, keepAvailable:false}, // auto | none | tier | custom
    priorBalance:0,
    status:'open', createdAt:todayISO()
  };
  computeInvoiceTotals(inv);
  DB.invoices.push(inv);
  entryIds.forEach(id=>{ const e=DB.entries.find(x=>x.id===id); if(e) e.invoiceId=inv.id; });
  save();
  openInvoiceDoc(inv.id);
}

/* compute stored totals for list views (uses selected/effective discount) */
function computeInvoiceTotals(inv){
  const b=invoiceBreakdown(inv);
  inv.hourlyCharged=b.hourlyCharged; inv.fixedTotal=b.fixedTotal; inv.expenseTotal=b.expenseTotal;
  inv.discountAmount=b.discountApplied; inv.grandTotal=b.grandTotal;
}

/* full breakdown incl. discount options */
function invoiceBreakdown(inv){
  const entries = inv.entryIds.map(id=>DB.entries.find(e=>e.id===id)).filter(Boolean);
  const hourly = entries.filter(e=>e.type==='hourly');
  const fixed  = entries.filter(e=>e.type==='fixed');
  const expense= entries.filter(e=>e.type==='expense');
  const hourlyCharged = round2(hourly.filter(e=>!e.noCharge).reduce((s,e)=>s+entryAmount(e),0));
  const fixedTotal = round2(fixed.reduce((s,e)=>s+entryAmount(e),0));
  const expenseTotal = round2(expense.reduce((s,e)=>s+entryAmount(e),0));

  const d=inv.discountSnapshot||{type:'none'};
  const base = (d.appliesTo==='all') ? (hourlyCharged+fixedTotal) : hourlyCharged;

  // Build available discount options (tiers) with deadlines
  let options=[];
  if(d.type==='flat' && d.tiers?.[0]){
    options.push({id:d.tiers[0].id, label:d.tiers[0].label||'Discount', percent:d.tiers[0].percent, deadline:null, condText:'Applied to this invoice'});
  }else if(d.type==='tiered'){
    options = (d.tiers||[]).map(t=>{
      let deadline=null, condText='';
      if(t.cond==='days'){ deadline=addDays(inv.date, t.days||0); condText=`if paid in full within ${t.days} day(s) — by ${fmtDate(deadline)}`; }
      else if(t.cond==='eom'){ deadline=endOfMonth(inv.date); condText=`if paid in full by end of invoice month — by ${fmtDate(deadline)}`; }
      return {id:t.id, label:t.label||'Discount', percent:t.percent, deadline, condText};
    });
  }
  options.forEach(o=>o.amount=round2(base*o.percent/100));

  // Determine effective discount from override
  const ov=inv.discountOverride||{mode:'auto'};
  let effPercent=0, effLabel='', effAmount=0, effId='';
  if(ov.mode==='custom'){ effPercent=Number(ov.customPct)||0; effLabel='Discount (manual override)'; effId='custom'; }
  else if(ov.mode==='none'){ effPercent=0; }
  else if(ov.mode==='tier'){ const o=options.find(x=>x.id===ov.tierId); if(o){ effPercent=o.percent; effLabel=o.label; effId=o.id; } }
  else { // auto = best tier still available as of today (unless keepAvailable overrides expiry)
    const today=todayISO();
    const avail = options.filter(o=>!o.deadline || o.deadline>=today || ov.keepAvailable);
    if(avail.length){ const best=avail.reduce((a,b)=>b.percent>a.percent?b:a); effPercent=best.percent; effLabel=best.label; effId=best.id; }
  }
  effAmount = round2(base*effPercent/100);

  const grandTotal = round2(hourlyCharged - (d.appliesTo==='all'?0:effAmount) + fixedTotal - (d.appliesTo==='all'?effAmount:0) + expenseTotal + (inv.priorBalance||0));
  // simpler: subtotal minus discount
  const subtotal = round2(hourlyCharged + fixedTotal + expenseTotal);
  const grand = round2(subtotal - effAmount + (inv.priorBalance||0));

  return {entries, hourly, fixed, expense, hourlyCharged, fixedTotal, expenseTotal,
    subtotal, options, base, discountApplied:effAmount, discountPercent:effPercent,
    discountLabel:effLabel, discountId:effId, grandTotal:grand};
}

const PAY_METHODS = ['Check','ACH / Wire','Credit Card','Cash','Trust Transfer','Other'];

/* Apply a payment to a client's account, allocating across one or more open invoices. */
function applyPaymentFlow(opts={}){
  if(!DB.clients.length){ alert('Create a client first.'); return; }
  const state = {
    id:uid('pay'),
    clientId: opts.clientId || DB.clients[0].id,
    date: todayISO(),
    amount: 0,
    method: 'Check',
    note: '',
    alloc: {}  // invoiceId -> amount
  };
  openModal('Apply Payment', body=>{
    body.innerHTML=`
      <div class="grid g3">
        <div><label>Client *</label><select id="p_client">${DB.clients.map(c=>`<option value="${c.id}"${c.id===state.clientId?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
        <div><label>Payment date</label><input type="date" id="p_date" value="${state.date}"></div>
        <div><label>Method</label><select id="p_method">${PAY_METHODS.map(m=>`<option${m===state.method?' selected':''}>${m}</option>`).join('')}</select></div>
        <div style="grid-column:1/-1"><label>Reference / note (check no., confirmation, etc.)</label><input id="p_note" value=""></div>
      </div>
      <div class="row" style="margin-top:12px;align-items:center">
        <div style="max-width:180px"><label>Payment amount</label><input type="number" id="p_amt" value="0" step="0.01" min="0"></div>
        <button class="btn sec sm" id="p_auto" type="button">Auto-apply to oldest</button>
        <button class="btn ghost sm" id="p_clear" type="button">Clear allocations</button>
      </div>
      <div class="subhead">Apply to open invoices</div>
      <div id="p_allocWrap"></div>
      <div id="p_recap" class="note" style="margin-top:12px"></div>`;
    const cS=$('#p_client',body), amtI=$('#p_amt',body);
    cS.onchange=()=>{ state.clientId=cS.value; state.alloc={}; drawAlloc(); };
    amtI.oninput=()=>{ state.amount=Number(amtI.value)||0; recap(); };
    $('#p_auto',body).onclick=()=>autoApply();
    $('#p_clear',body).onclick=()=>{ state.alloc={}; drawAlloc(); };

    function invoicesList(){ return openInvoicesFor(state.clientId); }
    function allocSum(){ return round2(Object.values(state.alloc).reduce((s,v)=>s+(Number(v)||0),0)); }

    function drawAlloc(){
      const w=$('#p_allocWrap',body);
      const list=invoicesList();
      if(!list.length){ w.innerHTML=`<div class="small muted">No open invoices for this client. The full amount will be recorded as an unapplied credit on the client's account.</div>`; recap(); return; }
      w.innerHTML=`<table><thead><tr><th>Invoice</th><th>Date</th><th class="num">Balance</th><th class="num" style="width:130px">Apply</th></tr></thead><tbody>`+
        list.map(i=>`<tr>
          <td><b>${esc(i.number)}</b><br><span class="small muted">${esc(i.matterNames||'')}</span></td>
          <td class="nowrap">${fmtDate(i.date)}</td>
          <td class="num">${money(invoiceBalance(i))}</td>
          <td class="num"><input type="number" class="p_al" data-inv="${i.id}" value="${state.alloc[i.id]!=null?state.alloc[i.id]:''}" step="0.01" min="0" style="text-align:right"></td>
        </tr>`).join('')+`</tbody></table>`;
      w.querySelectorAll('.p_al').forEach(inp=>inp.oninput=()=>{
        const id=inp.dataset.inv, v=Number(inp.value)||0;
        if(v>0) state.alloc[id]=round2(v); else delete state.alloc[id];
        recap();
      });
      recap();
    }
    function autoApply(){
      let remaining = state.amount>0 ? state.amount : invoicesList().reduce((s,i)=>s+invoiceBalance(i),0);
      if(state.amount<=0){ state.amount=round2(remaining); amtI.value=state.amount; }
      remaining = state.amount;
      state.alloc={};
      for(const i of invoicesList()){
        if(remaining<=0.005) break;
        const bal=invoiceBalance(i); const use=Math.min(bal, remaining);
        if(use>0){ state.alloc[i.id]=round2(use); remaining=round2(remaining-use); }
      }
      drawAlloc();
    }
    function recap(){
      const applied=allocSum(), unapplied=round2((state.amount||0)-applied);
      const el=$('#p_recap',body);
      const over = applied>(state.amount||0)+0.005;
      el.innerHTML=`Payment: <b>${money(state.amount||0)}</b> &nbsp;·&nbsp; Applied to invoices: <b>${money(applied)}</b> &nbsp;·&nbsp;
        ${over?`<span style="color:var(--bad)"><b>Over-applied by ${money(applied-(state.amount||0))}</b> — reduce allocations.</span>`
             :`Unapplied credit: <b>${money(unapplied)}</b>`}`;
      el.style.borderLeftColor = over ? 'var(--bad)' : 'var(--gold)';
    }
    drawAlloc();
    if(opts.focusInvoiceId){ const inv=DB.invoices.find(i=>i.id===opts.focusInvoiceId); if(inv){ state.amount=invoiceBalance(inv); amtI.value=state.amount; autoApply(); } }
  }, ()=>{
    state.date=$('#p_date').value; state.method=$('#p_method').value; state.note=$('#p_note').value;
    state.amount=Number($('#p_amt').value)||0;
    if(state.amount<=0){ alert('Enter a payment amount.'); return false; }
    const applied=round2(Object.values(state.alloc).reduce((s,v)=>s+(Number(v)||0),0));
    if(applied>state.amount+0.005){ alert('Allocations exceed the payment amount. Reduce the amounts applied.'); return false; }
    const allocations=Object.entries(state.alloc).filter(([,v])=>Number(v)>0).map(([invoiceId,amount])=>({invoiceId, amount:round2(amount)}));
    DB.payments.push({id:state.id, clientId:state.clientId, date:state.date, amount:round2(state.amount),
      method:state.method, note:state.note, allocations});
    allocations.forEach(a=>{ const inv=DB.invoices.find(i=>i.id===a.invoiceId); if(inv) recomputeInvoiceStatus(inv); });
    save(); render(); return true;
  }, null, 'Record Payment');
}

function editPayment(p){
  openModal('Payment — '+fmtDate(p.date), body=>{
    const inv = p.allocations && p.allocations.length ? p.allocations.map(a=>DB.invoices.find(i=>i.id===a.invoiceId)?.number).filter(Boolean).join(', ') : (p.invoiceId?DB.invoices.find(i=>i.id===p.invoiceId)?.number:'');
    body.innerHTML=`<table>
      <tr><td class="lbl">Client</td><td>${esc(clientById(p.clientId)?.name||'—')}</td></tr>
      <tr><td class="lbl">Date</td><td>${fmtDate(p.date)}</td></tr>
      <tr><td class="lbl">Amount</td><td><b>${money(p.amount)}</b></td></tr>
      <tr><td class="lbl">Method</td><td>${esc(p.method||'')}</td></tr>
      <tr><td class="lbl">Reference</td><td>${esc(p.note||'—')}</td></tr>
      <tr><td class="lbl">Applied to</td><td>${esc(inv||'Unapplied credit')}</td></tr>
      <tr><td class="lbl">Applied</td><td>${money(paymentApplied(p))}</td></tr>
      <tr><td class="lbl">Unapplied</td><td>${money(paymentUnapplied(p))}</td></tr>
    </table>`;
  }, ()=>true, {delete:()=>{
    if(confirm('Delete this payment? This will restore the affected invoice balances.')){
      const affected=(p.allocations||[]).map(a=>a.invoiceId).concat(p.invoiceId?[p.invoiceId]:[]);
      DB.payments=DB.payments.filter(x=>x.id!==p.id);
      affected.forEach(id=>{ const inv=DB.invoices.find(i=>i.id===id); if(inv) recomputeInvoiceStatus(inv); });
      save(); render(); closeModal();
    }
  }}, 'Close');
}

function recomputeInvoiceStatus(inv){
  if(inv.status==='void') return;
  inv.status = invoiceBalance(inv)<=0.005 ? 'paid' : 'open';
}

      </tbody>

  const fixedSection = b.fixed.length ? `

        <tr><th style="width:66px">Date</th><th>Description</th><th class="num" style="width:78px">Amount</th></tr>

            <tr><td>Matter(s)</td><td>${esc(inv.matterNames||'—')}</td></tr>
            ${DB.firm.barNo?`<tr><td>Bar No.</td><td>${esc(DB.firm.barNo)}</td></tr>`:''}
            ${statusChip?`<tr><td>Status</td><td>${statusChip}</td></tr>`:''}
          </table>
        </div>
      </div>

      <div class="summary">
        <div class="cell"><div class="lbl">Invoice Total</div><div class="amt">${money(b.grandTotal)}</div></div>
        <div class="cell"><div class="lbl">Payments &amp; Credits</div><div class="amt">-${money(paid)}</div></div>

function discountControls(){ return ''; }
function discountNotice(inv,b){
  if(!b.options.length) return '';
  const rows=b.options.map(o=>{
    const net=round2(b.subtotal - o.amount + (inv.priorBalance||0));
    return `<tr><td>${esc(o.label)}</td><td>${esc(o.condText)}</td><td class="num">${num(o.percent)}%</td><td class="num">-${money(o.amount)}</td><td class="num"><b>${money(net)}</b></td></tr>`;
  }).join('');
  const d=inv.discountSnapshot;
  return `<div class="note">
    <b>Prompt-Payment Discount.</b> ${d.appliesTo==='all'?'Applies to hourly and fixed fees.':'Applies to hourly fees only.'}
    ${d.note?`<div style="margin:4px 0">${esc(d.note)}</div>`:''}
    <table style="margin-top:6px"><tr><th>Discount</th><th>Condition</th><th class="num">Rate</th><th class="num">Savings</th><th class="num">Net if applicable</th></tr>${rows}</table>
    ${inv.discountOverride?.keepAvailable?`<div style="margin-top:6px"><i>Discount eligibility extended by the firm; the above remains available notwithstanding the stated deadline.</i></div>`:''}
  </div>`;
}

function editDiscount(inv){
  const b=invoiceBreakdown(inv);
  const ov=inv.discountOverride||(inv.discountOverride={mode:'auto',tierId:'',customPct:0,keepAvailable:false});
  openModal('Discount — '+inv.number, body=>{
    body.innerHTML=`
      <div class="small muted" style="margin-bottom:10px">Choose how the discount is applied to the invoice total. “Automatic” selects the best tier that is still within its deadline as of today (${fmtDate(todayISO())}).</div>
      <label class="chk" style="margin:6px 0"><input type="radio" name="ovm" value="auto" ${ov.mode==='auto'?'checked':''}> Automatic (deadline-based)</label>
      <label class="chk" style="margin:6px 0"><input type="radio" name="ovm" value="none" ${ov.mode==='none'?'checked':''}> No discount applied to total</label>
      ${b.options.map(o=>`<label class="chk" style="margin:6px 0"><input type="radio" name="ovm" value="tier:${o.id}" ${ov.mode==='tier'&&ov.tierId===o.id?'checked':''}> Force apply: ${esc(o.label)} (${num(o.percent)}% = -${money(o.amount)})</label>`).join('')}
      <label class="chk" style="margin:6px 0"><input type="radio" name="ovm" value="custom" ${ov.mode==='custom'?'checked':''}> Custom override %: <input type="number" id="ov_pct" value="${ov.customPct||0}" step="0.5" style="width:90px;margin-left:6px"></label>
      <hr class="hr">
      <label class="chk"><input type="checkbox" id="ov_keep" ${ov.keepAvailable?'checked':''}> <b>Extend eligibility</b> — keep discounts available even after their deadline passes (overrides automatic removal when we extend the offer)</label>`;
  }, ()=>{
    const v=body.querySelector('input[name="ovm"]:checked')?.value||'auto';
    if(v==='auto'){ ov.mode='auto'; ov.tierId=''; }
    else if(v==='none'){ ov.mode='none'; ov.tierId=''; }
    else if(v==='custom'){ ov.mode='custom'; ov.customPct=Number($('#ov_pct').value)||0; }
    else if(v.startsWith('tier:')){ ov.mode='tier'; ov.tierId=v.slice(5); }
    ov.keepAvailable=$('#ov_keep').checked;
    computeInvoiceTotals(inv); save(); openInvoiceDoc(inv.id); return true;
  });
}

function applyTrustToInvoice(inv){
  const bal=invoiceBalance(inv);
  const tb=trustBalance(inv.clientId);
  if(tb<=0){ alert('No trust funds available for this client.'); return; }
  let amt=Math.min(bal,tb);
  openModal('Apply Trust to '+inv.number, body=>{
    body.innerHTML=`<div class="grid g2">
      <div><label>Amount to apply</label><input type="number" id="t_amt" value="${round2(amt)}" step="0.01"></div>
      <div><label>Date</label><input type="date" id="t_date" value="${todayISO()}"></div>
    </div>
    <div class="note small muted" style="margin-top:10px">Trust available: <b>${money(tb)}</b> · Invoice balance: <b>${money(bal)}</b>.
    Applying trust records a disbursement from the client’s IOLTA account to fees/costs earned (MRPC 1.15).</div>`;
  }, ()=>{
    amt=Number($('#t_amt').value)||0;
    if(amt<=0){ alert('Enter an amount.'); return false; }
    if(amt>tb+0.005){ alert('Exceeds available trust balance.'); return false; }
    DB.trust.push({id:uid('tr'), clientId:inv.clientId, matterId:inv.matterIds[0]||null, date:$('#t_date').value,
      type:'apply', amount:round2(amt), note:'Applied to invoice '+inv.number, invoiceId:inv.id});
    recomputeInvoiceStatus(inv); save(); openInvoiceDoc(inv.id); return true;
  });
}

function trustBalance(clientId){
  return round2(DB.trust.filter(t=>t.clientId===clientId).reduce((s,t)=>{
    if(t.type==='deposit') return s+t.amount;
    if(t.type==='apply'||t.type==='refund') return s-t.amount;
    if(t.type==='adjust') return s+t.amount;
    return s;
  },0));
}
function viewTrust(main){
  main.innerHTML=`
    <div class="topbar"><div><h1>Retainers &amp; Trust</h1><div class="sub">Client trust / IOLTA ledger and retainer requests (MRPC 1.15)</div></div>
      <div class="pill-row">
        <button class="btn" id="newRet">＋ Retainer Request</button>
        <button class="btn sec" id="newDeposit">＋ Record Deposit</button>
      </div></div>
    <div class="grid g2">
      <div class="card"><h3>Trust Balances by Client</h3><div id="trustBal"></div></div>
      <div class="card"><h3>Retainer Requests</h3><div id="retList"></div></div>
    </div>
    <div class="card"><h3>Trust Ledger <span class="r"><select id="ledgerClient" style="width:auto"></select></span></h3><div id="ledger"></div></div>`;
  $('#newRet').onclick=()=>editRetainer();
  $('#newDeposit').onclick=()=>recordTrust('deposit');

  $('#trustBal').innerHTML = DB.clients.length? `<table><thead><tr><th>Client</th><th class="num">Balance</th><th></th></tr></thead><tbody>`+
    DB.clients.map(c=>`<tr><td>${esc(c.name)}</td><td class="num">${money(trustBalance(c.id))}</td>
      <td class="right"><button class="btn ghost sm" data-refund="${c.id}">Refund</button></td></tr>`).join('')+`</tbody></table>`
    : `<div class="empty">No clients.</div>`;
  $('#trustBal').querySelectorAll('[data-refund]').forEach(b=>b.onclick=()=>recordTrust('refund',b.dataset.refund));

  const rl=$('#retList');
  rl.innerHTML = DB.retainers.length? `<table><thead><tr><th>No.</th><th>Client</th><th class="num">Amount</th><th>Status</th><th></th></tr></thead><tbody>`+
    DB.retainers.slice().reverse().map(r=>`<tr><td><b>${esc(r.number)}</b><br><span class="small muted">${fmtDate(r.date)}</span></td>
      <td>${esc(clientById(r.clientId)?.name||'—')}<br><span class="small muted">${esc(matterById(r.matterId)?.name||'')}</span></td>
      <td class="num">${money(r.amount)}</td>
      <td>${r.status==='funded'?'<span class="tag good">Funded</span>':'<span class="tag warn">Requested</span>'}</td>
      <td class="right nowrap"><button class="btn ghost sm" data-openret="${r.id}">Open</button>
        ${r.status!=='funded'?`<button class="btn ghost sm" data-fund="${r.id}">Mark funded</button>`:''}</td></tr>`).join('')+`</tbody></table>`
    : `<div class="empty">No retainer requests.</div>`;
  rl.querySelectorAll('[data-openret]').forEach(b=>b.onclick=()=>openRetainerDoc(b.dataset.openret));
  rl.querySelectorAll('[data-fund]').forEach(b=>b.onclick=()=>fundRetainer(b.dataset.fund));

  const lc=$('#ledgerClient');
  lc.innerHTML=`<option value="">All clients</option>`+DB.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  lc.value=viewTrust._lc||''; lc.onchange=()=>{ viewTrust._lc=lc.value; drawLedger(); };
  drawLedger();
  function drawLedger(){
    let tx=DB.trust.slice();
    if(viewTrust._lc) tx=tx.filter(t=>t.clientId===viewTrust._lc);
    tx.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const w=$('#ledger');
    if(!tx.length){ w.innerHTML=`<div class="empty">No trust transactions.</div>`; return; }
    let run={};
    w.innerHTML=`<table><thead><tr><th>Date</th><th>Client</th><th>Type</th><th>Description</th><th class="num">In</th><th class="num">Out</th><th class="num">Balance</th><th></th></tr></thead><tbody>`+
      tx.map(t=>{
        const inAmt=(t.type==='deposit'||t.type==='adjust'&&t.amount>=0)?t.amount:0;
        const outAmt=(t.type==='apply'||t.type==='refund'||(t.type==='adjust'&&t.amount<0))?Math.abs(t.amount):0;
        run[t.clientId]=(run[t.clientId]||0)+(t.type==='deposit'?t.amount:t.type==='adjust'?t.amount:-t.amount);
        return `<tr><td class="nowrap">${fmtDate(t.date)}</td><td class="small">${esc(clientById(t.clientId)?.name||'')}</td>
          <td>${trustTypeTag(t.type)}</td><td>${esc(t.note||'')}</td>
          <td class="num">${inAmt?money(inAmt):''}</td><td class="num">${outAmt?money(outAmt):''}</td>
          <td class="num">${money(run[t.clientId])}</td>
          <td class="right">${t.invoiceId?'':`<button class="btn ghost sm" data-deltr="${t.id}">✕</button>`}</td></tr>`;
      }).join('')+`</tbody></table>`;
    w.querySelectorAll('[data-deltr]').forEach(b=>b.onclick=()=>{ if(confirm('Delete this trust transaction?')){ DB.trust=DB.trust.filter(x=>x.id!==b.dataset.deltr); save(); render(); } });
  }
}
function trustTypeTag(t){ return t==='deposit'?'<span class="tag good">Deposit</span>':t==='apply'?'<span class="tag info">Applied</span>':t==='refund'?'<span class="tag warn">Refund</span>':'<span class="tag gray">Adjust</span>'; }

function recordTrust(type, clientId){
  let t={id:uid('tr'), clientId:clientId||DB.clients[0]?.id||'', matterId:null, date:todayISO(), type, amount:0, note:type==='deposit'?'Retainer deposit into trust':type==='refund'?'Refund of unearned trust to client':'', invoiceId:null};
  if(!DB.clients.length){ alert('Create a client first.'); return; }
  openModal(type==='deposit'?'Record Trust Deposit':type==='refund'?'Record Trust Refund':'Trust Adjustment', body=>{
    body.innerHTML=`<div class="grid g2">
      <div><label>Client</label><select id="t_client">${DB.clients.map(c=>`<option value="${c.id}"${c.id===t.clientId?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div><label>Date</label><input type="date" id="t_date" value="${t.date}"></div>
      <div><label>Amount</label><input type="number" id="t_amt" value="0" step="0.01"></div>
      <div><label>Note</label><input id="t_note" value="${esc(t.note)}"></div>
    </div>
    ${type==='refund'?`<div class="note small muted" style="margin-top:10px">Refunds reduce the trust balance. Refund only unearned funds to the client (MRPC 1.15/1.16).</div>`:''}`;
  }, ()=>{
    t.clientId=$('#t_client').value; t.date=$('#t_date').value; t.amount=round2(Number($('#t_amt').value)||0); t.note=$('#t_note').value;
    if(t.amount<=0){ alert('Enter a positive amount.'); return false; }
    if(type==='refund' && t.amount>trustBalance(t.clientId)+0.005){ alert('Refund exceeds trust balance.'); return false; }
    DB.trust.push(t); save(); render(); return true;
  });
}

function editRetainer(){
  if(!DB.clients.length){ alert('Create a client first.'); return; }
  let r={id:uid('ret'), number:DB.firm.retainerPrefix+DB.firm.nextRetainerNo, clientId:DB.clients[0].id,

  openModal('New Retainer Request', body=>{
    const drawMatters=(cid,selId)=>mattersFor(cid).map(m=>`<option value="${m.id}"${m.id===selId?' selected':''}>${esc(m.name)}</option>`).join('');

function fundRetainer(id){

      amount:r.amount, note:'Retainer '+r.number+' deposited into trust', invoiceId:null});
    save(); render();
  }
}

    <div class="card">
      <div class="row">
        <div style="min-width:260px"><label>Client</label><select id="s_client">${DB.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
        <div><label>&nbsp;</label><button class="btn" id="genStmt">Generate Statement</button></div>
      </div>
    </div>
    <div id="stmtPreview"></div>`;
  if(!DB.clients.length){ $('#stmtPreview').innerHTML=`<div class="card"><div class="empty">No clients.</div></div>`; return; }
  $('#genStmt').onclick=()=>openStatementDoc($('#s_client').value);
  // show quick preview list
  const c0=DB.clients[0];
  $('#s_client').onchange=()=>{};
}
function openStatementDoc(clientId){
  const c=clientById(clientId);
  const invs=DB.invoices.filter(i=>i.clientId===clientId&&i.status!=='void').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const pays=DB.payments.filter(p=>p.clientId===clientId).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const totalBilled=round2(invs.reduce((s,i)=>s+(i.grandTotal||0),0));
  const totalPaid=round2(invs.reduce((s,i)=>s+invoicePaid(i),0));
  const totalDue=round2(invs.reduce((s,i)=>s+invoiceBalance(i),0));
  const trustBal=trustBalance(clientId);

  const credit=clientCredit(clientId);
  const invRows=invs.length? invs.map(i=>`<tr><td class="nowrap">${fmtDate(i.date)}</td><td>${esc(i.number)}</td><td>${esc(i.matterNames||'')}</td>
    <td class="num">${money(i.grandTotal)}</td><td class="num">${money(invoicePaid(i))}</td><td class="num">${money(invoiceBalance(i))}</td></tr>`).join('')
    : `<tr><td colspan="6" class="center muted">No invoices.</td></tr>`;

  const doc=`
    <div class="docbar noprint">
      <button class="btn" onclick="window.print()">🖨 Print / Save PDF</button>
      <button class="btn sec" id="payBtn">Apply Payment</button>
      <span class="spacer"></span><button class="btn sec" id="backBtn">← Back</button>
    </div>
    <div class="doc">
      ${letterhead()}
      <div class="meta">
        <div class="party"><div class="lbl">Client</div>${partyBlock(c)}</div>
        <div>
          <h1 class="doctitle">Statement</h1>
          <table class="metatable" style="margin-top:8px">
            <tr><td>Statement Date</td><td>${fmtDate(todayISO())}</td></tr>
            <tr><td>Open Invoices</td><td>${invs.filter(i=>invoiceBalance(i)>0.005).length}</td></tr>
          </table>
        </div>
      </div>

      <div class="summary">
        <div class="cell"><div class="lbl">Total Billed</div><div class="amt">${money(totalBilled)}</div></div>
        <div class="cell"><div class="lbl">Payments &amp; Credits</div><div class="amt">-${money(totalPaid)}</div></div>
        <div class="cell due"><div class="lbl">Balance Due</div><div class="amt">${money(totalDue)}</div></div>
      </div>

      <table style="margin-top:18px">
        <thead>
          <tr class="sec-title"><td colspan="6">Account Activity — Invoices</td></tr>
          <tr><th>Date</th><th>Invoice</th><th>Matter(s)</th><th class="num">Total</th><th class="num">Paid/Credited</th><th class="num">Balance</th></tr>
        </thead>
        <tbody>
          ${invRows}
          <tr class="subtot"><td colspan="3" class="num">Totals</td><td class="num">${money(totalBilled)}</td><td class="num">${money(totalPaid)}</td><td class="num">${money(totalDue)}</td></tr>
        </tbody>
      </table>

      ${pays.length?`<table style="margin-top:16px">
        <thead>
          <tr class="sec-title"><td colspan="4">Payments Received</td></tr>
          <tr><th>Date</th><th>Method</th><th>Reference / applied to</th><th class="num">Amount</th></tr>
        </thead>
        <tbody>
        ${pays.map(p=>{
          const invNos=(p.allocations&&p.allocations.length)?p.allocations.map(a=>DB.invoices.find(i=>i.id===a.invoiceId)?.number).filter(Boolean).join(', ')
            :(p.invoiceId?(DB.invoices.find(i=>i.id===p.invoiceId)?.number||''):'');
          const un=paymentUnapplied(p);
          return `<tr><td class="nowrap">${fmtDate(p.date)}</td><td>${esc(p.method||'')}</td>
            <td>${esc(p.note||'')}${invNos?` <span class="muted">→ ${esc(invNos)}</span>`:''}${un>0.005?` <span class="muted">(credit ${money(un)})</span>`:''}</td>
            <td class="num">${money(p.amount)}</td></tr>`;
        }).join('')}
        </tbody>
      </table>`:''}

      <table class="totals">
        <tr><td>Total billed</td><td>${money(totalBilled)}</td></tr>
        <tr class="disc"><td>Total paid / credited</td><td>-${money(totalPaid)}</td></tr>
        <tr class="grand"><td>Balance Due</td><td>${money(totalDue)}</td></tr>
        ${credit>0.005?`<tr class="rule"><td>Unapplied credit on account</td><td>${money(credit)}</td></tr>`:''}
        <tr class="rule"><td>Client trust (IOLTA) balance</td><td>${money(trustBal)}</td></tr>
      </table>

      <div class="note"><b>Client Trust.</b> ${esc(DB.firm.trustNotice)}</div>
      <div class="small muted" style="margin-top:14px">Prepared in accordance with the Michigan Rules of Professional Conduct. Please remit the balance due to ${esc(DB.firm.name)}.</div>
    </div>`;
  showDoc(doc);
  $('#backBtn').onclick=()=>{ DB.ui.tab='statements'; save(); render(); };
  $('#payBtn').onclick=()=>applyPaymentFlow({clientId});
}

/* =========================================================================
   FIRM SETTINGS
   ========================================================================= */
function viewSettings(main){
  const f=DB.firm;
  main.innerHTML=`
    <div class="topbar"><div><h1>Firm Settings</h1><div class="sub">Firm identity, trust account, numbering, and default terms</div></div></div>
    <div class="card"><h3>Firm Information</h3>
      <div class="grid g2">
        <div><label>Firm name</label><input id="f_name" value="${esc(f.name)}"></div>
        <div><label>Attorney / Bar No.</label><input id="f_bar" value="${esc(f.barNo)}"></div>
        <div><label>Address line</label><input id="f_line1" value="${esc(f.line1)}"></div>
        <div class="grid g3" style="gap:8px">
          <div><label>City</label><input id="f_city" value="${esc(f.city)}"></div>
          <div><label>State</label><input id="f_state" value="${esc(f.state)}"></div>
          <div><label>ZIP</label><input id="f_zip" value="${esc(f.zip)}"></div>
        </div>
        <div><label>Phone</label><input id="f_phone" value="${esc(f.phone)}"></div>
        <div><label>Facsimile</label><input id="f_fax" value="${esc(f.fax||'')}"></div>
        <div><label>Website</label><input id="f_web" value="${esc(f.website||'')}"></div>
        <div><label>Email</label><input id="f_email" value="${esc(f.email)}"></div>
        <div><label>EIN / Tax ID</label><input id="f_ein" value="${esc(f.ein)}"></div>
      </div>
      <div class="hr"></div>
      <div class="row" style="align-items:center">
        <div><label>Letterhead logo (optional)</label>
          <input type="file" id="f_logofile" accept="image/*" style="max-width:280px"></div>
        <div id="logoPrev">${f.logo?`<img src="${esc(f.logo)}" style="max-height:56px;max-width:120px;border:1px solid var(--line);border-radius:4px;padding:2px;background:#fff">`:'<span class="small muted">No logo</span>'}</div>
        ${f.logo?`<div><button class="btn ghost sm" id="f_logoclear">Remove logo</button></div>`:''}
      </div>
      <div class="small muted" style="margin-top:6px">The logo (or, if none, the firm name in the brand emerald) prints at the top-left of every invoice, statement, and retainer request. The CM Advisory Corp brand lockup is preloaded — replace or remove it here to use your own.</div>
    </div>
    <div class="card"><h3>Client Trust (IOLTA) Account</h3>
      <div class="grid g2">
        <div><label>Trust bank name</label><input id="f_tbank" value="${esc(f.trustBank)}"></div>
        <div><label>Trust account (last 4 / reference)</label><input id="f_tacct" value="${esc(f.trustAcct)}"></div>
        <div style="grid-column:1/-1"><label>Trust notice (prints on invoices, statements, retainer requests)</label><textarea id="f_tnotice">${esc(f.trustNotice)}</textarea></div>
      </div>
    </div>
    <div class="card"><h3>Numbering &amp; Terms</h3>
      <div class="grid g2">
        <div><label>Invoice prefix</label><input id="f_iprefix" value="${esc(f.invoicePrefix)}"></div>
        <div><label>Next invoice number</label><input type="number" id="f_inext" value="${f.nextInvoiceNo}"></div>
        <div><label>Retainer prefix</label><input id="f_rprefix" value="${esc(f.retainerPrefix)}"></div>
        <div><label>Next retainer number</label><input type="number" id="f_rnext" value="${f.nextRetainerNo}"></div>
        <div style="grid-column:1/-1"><label>Default payment terms (prints on invoices)</label><textarea id="f_terms">${esc(f.terms)}</textarea></div>
      </div>
    </div>
    <div class="card"><h3>Timekeepers / Rates</h3><div id="tkList"></div>
      <button class="btn sec sm" id="addTk" style="margin-top:8px">＋ Add timekeeper</button></div>
    <div class="row"><button class="btn" id="saveSettings">Save Settings</button>
      <span id="savedMsg" class="tag good" style="display:none;align-self:center">Saved ✓</span></div>
    <div class="card" style="margin-top:18px"><h3>Data</h3>
      <div class="pill-row">
        <button class="btn sec" id="exportBtn">⬇ Export backup (JSON)</button>
        <button class="btn sec" id="importBtn">⬆ Import backup</button>
        <input type="file" id="importFile" accept="application/json" style="display:none">
        <button class="btn danger" id="resetBtn">Reset all data</button>
      </div>
      <div class="small muted" style="margin-top:8px">All data is stored locally in this browser (localStorage). Export regularly to back up.</div>
    </div>`;
  drawTk();
  $('#addTk').onclick=()=>{ DB.timekeepers.push({id:uid('tk'),name:'',initials:'',rate:0,active:true}); save(); drawTk(); };
  $('#saveSettings').onclick=()=>{
    const g=id=>$('#'+id).value;
    Object.assign(f,{name:g('f_name'),barNo:g('f_bar'),line1:g('f_line1'),city:g('f_city'),state:g('f_state'),zip:g('f_zip'),
      phone:g('f_phone'),fax:g('f_fax'),website:g('f_web'),email:g('f_email'),ein:g('f_ein'),trustBank:g('f_tbank'),trustAcct:g('f_tacct'),trustNotice:g('f_tnotice'),
      invoicePrefix:g('f_iprefix'),nextInvoiceNo:Number(g('f_inext'))||1001,retainerPrefix:g('f_rprefix'),nextRetainerNo:Number(g('f_rnext'))||1,
      terms:g('f_terms')});
    save(); const m=$('#savedMsg'); m.style.display='inline-block'; setTimeout(()=>m.style.display='none',1500); render();
  };
  $('#f_logofile').onchange=ev=>{
    const file=ev.target.files[0]; if(!file) return;
    if(file.size>600000){ alert('Please use a logo image under ~600 KB.'); return; }
    const rd=new FileReader();
    rd.onload=()=>{ DB.firm.logo=rd.result; save(); viewSettings(main); };
    rd.readAsDataURL(file);
  };
  const lc=$('#f_logoclear'); if(lc) lc.onclick=()=>{ DB.firm.logo=''; save(); viewSettings(main); };
  $('#exportBtn').onclick=exportData;
  $('#importBtn').onclick=()=>$('#importFile').click();
  $('#importFile').onchange=importData;
  $('#resetBtn').onclick=()=>{ if(confirm('Erase ALL data and restore the sample database? This cannot be undone.')){ localStorage.removeItem(LS_KEY); DB=seed(); save(); render(); } };

  function drawTk(){
    const w=$('#tkList');
    w.innerHTML=`<table><thead><tr><th>Name</th><th>Initials</th><th class="num">Rate</th><th></th></tr></thead><tbody>`+
      DB.timekeepers.map(t=>`<tr data-id="${t.id}">
        <td><input class="tk_name" value="${esc(t.name)}"></td>
        <td><input class="tk_init" value="${esc(t.initials)}" style="max-width:90px"></td>
        <td class="num"><input type="number" class="tk_rate" value="${t.rate}" step="5" style="max-width:110px"></td>
        <td class="right"><button class="btn ghost sm tk_del">✕</button></td></tr>`).join('')+`</tbody></table>`;
    w.querySelectorAll('tr[data-id]').forEach(r=>{
      const t=tkById(r.dataset.id);
      r.querySelector('.tk_name').oninput=e=>{ t.name=e.target.value; save(); };
      r.querySelector('.tk_init').oninput=e=>{ t.initials=e.target.value; save(); };
      r.querySelector('.tk_rate').oninput=e=>{ t.rate=Number(e.target.value)||0; save(); };
      r.querySelector('.tk_del').onclick=()=>{ if(DB.timekeepers.length<=1){ alert('Keep at least one timekeeper.'); return; } DB.timekeepers=DB.timekeepers.filter(x=>x.id!==t.id); save(); drawTk(); };
    });
  }
}
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='legal-billing-backup-'+todayISO()+'.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importData(ev){
  const file=ev.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const data=JSON.parse(rd.result); if(!data.firm||!data.clients){ throw new Error('Not a valid backup.'); }
    if(confirm('Replace all current data with this backup?')){ DB=data; save(); render(); } }
    catch(e){ alert('Import failed: '+e.message); } };
  rd.readAsText(file);
}

/* =========================================================================
   MODAL + DOC infra
   ========================================================================= */
function openModal(title, buildBody, onSave, extra, saveLabel){
  const host=$('#modalHost');
  host.innerHTML=`<div class="modal-bg"><div class="modal ${title.length>40?'wide':''}">
    <div class="mh"><h3>${esc(title)}</h3><button class="x" id="mX">×</button></div>
    <div class="mb" id="mBody"></div>
    <div class="mf">
      ${extra?.delete?`<button class="btn danger" id="mDel" style="margin-right:auto">Delete</button>`:''}
      <button class="btn sec" id="mCancel">Cancel</button>
      <button class="btn" id="mSave">${esc(saveLabel||'Save')}</button>
    </div></div></div>`;
  const body=$('#mBody'); buildBody(body);
  $('#mX').onclick=closeModal; $('#mCancel').onclick=closeModal;
  $('#modalHost .modal-bg').onclick=e=>{ if(e.target.classList.contains('modal-bg')) closeModal(); };
  $('#mSave').onclick=()=>{ if(onSave()!==false) closeModal(); };
  if(extra?.delete) $('#mDel').onclick=extra.delete;
}
function closeModal(){ $('#modalHost').innerHTML=''; }

function showDoc(html){
  $('#main').style.display='none'; $('#side').style.display='';
  const w=$('#docwrap'); w.innerHTML=html; w.classList.add('show'); window.scrollTo(0,0);
}
function hideDoc(){ const w=$('#docwrap'); w.classList.remove('show'); w.innerHTML=''; $('#main').style.display=''; }

/* ---------- boot ---------- */
render();
</script>
</body>
</html>
