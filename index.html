    --emerald:#2748E0; --forest:#2C343C; --gold:#2748E0;
    --bg:#F1F2F1; --panel:#ffffff; --muted:#5A6672;
    --line:#E3E6E8; --accent:#2748E0; --accent2:#1B34A8; --accent-soft:#E9EDFD;
    --good:#16794C; --good-soft:#E6F2EC; --warn:#8A6100; --warn-soft:#FBF1DC;
    --bad:#B3271E; --bad-soft:#FBEAE8; --nc:#6A4BB5; --nc-soft:#F1ECFB;
    --radius:8px; --shadow:0 1px 3px rgba(15,20,25,.08),0 1px 2px rgba(15,20,25,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Geist',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;}
  h1,h2,h3,h4{margin:0 0 .4em; font-weight:600; line-height:1.25;}
  a{color:var(--accent2);}
  button{font-family:inherit; font-size:13px; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:13px; color:var(--ink);
    padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:#fff; width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft); border-color:var(--accent2);}
  textarea{resize:vertical; min-height:60px;}
  label{display:block; font-size:12px; color:var(--muted); margin:0 0 3px; font-weight:500;}
  .btn{background:var(--accent); color:#fff; border:1px solid var(--accent); padding:8px 14px;
    border-radius:6px; font-weight:500;}
  .btn:hover{background:var(--accent2);}
  .btn.sec{background:#fff; color:var(--accent); border-color:var(--line);}
  .btn.sec:hover{border-color:var(--accent2); background:var(--accent-soft);}
  .btn.ghost{background:transparent; color:var(--muted); border-color:transparent; padding:5px 8px;}
  .btn.ghost:hover{color:var(--ink); background:#eef0f3;}
  .btn.danger{background:#fff; color:var(--bad); border-color:var(--line);}
  .btn.danger:hover{background:var(--bad-soft); border-color:var(--bad);}
  .btn.sm{padding:5px 9px; font-size:12px;}
  .tag{display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600; white-space:nowrap;}
  .tag.good{background:var(--good-soft); color:var(--good);}
  .tag.warn{background:var(--warn-soft); color:var(--warn);}
  .tag.bad{background:var(--bad-soft); color:var(--bad);}
  .tag.nc{background:var(--nc-soft); color:var(--nc);}
  .tag.info{background:var(--accent-soft); color:var(--accent);}
  .tag.gray{background:#eceef1; color:var(--muted);}

  /* Layout */
  #app{display:flex; min-height:100vh;}
  #side{width:222px; background:linear-gradient(180deg,#12181E,#0B0F13); color:#cfe0d8; flex:0 0 222px; padding:0; position:sticky; top:0; height:100vh; overflow:auto;}
  #side .brand{padding:18px 18px 14px; border-bottom:1px solid rgba(255,255,255,.10); display:flex; align-items:center; gap:10px;}
  #side .brand .mono{width:34px; height:34px; border-radius:8px; background:#0A3B2D; color:var(--paper); font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; letter-spacing:.02em; border-bottom:2px solid var(--gold);}
  #side .brand b{color:#fff; font-size:14px; display:block; line-height:1.15;}
  #side .brand span{font-size:10.5px; color:#8B98A4; letter-spacing:.06em; text-transform:uppercase;}
  #side nav{padding:10px 0;}
  #side nav a{display:flex; align-items:center; gap:10px; padding:10px 18px; color:#cfe0d8; text-decoration:none; font-size:13.5px; cursor:pointer; border-left:3px solid transparent;}
  #side nav a:hover{background:rgba(255,255,255,.06); color:#fff;}
  #side nav a.active{background:rgba(39,72,224,.22); color:#fff; border-left-color:var(--gold); font-weight:600;}
  #side nav a .ic{width:18px; text-align:center; opacity:.85;}
  #main{flex:1; min-width:0; padding:24px 30px 60px; max-width:1180px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px; flex-wrap:wrap;}
  .topbar h1{font-size:22px; margin:0;}
  .topbar .sub{color:var(--muted); font-size:12.5px;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:18px;}
  .card h3{font-size:15px; display:flex; align-items:center; gap:8px; justify-content:space-between;}
  .card h3 .r{font-weight:400;}
  .grid{display:grid; gap:12px;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:1fr 1fr 1fr;}
  .g4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr;}}
  .row{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .right{text-align:right;}
  .center{text-align:center;}
  .nowrap{white-space:nowrap;}
  .spacer{flex:1;}
  .hr{height:1px; background:var(--line); margin:14px 0; border:0;}
  .pill-row{display:flex; gap:8px; flex-wrap:wrap;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:2px solid var(--line);}
  td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafbfc;}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .empty{padding:30px; text-align:center; color:var(--muted); font-style:italic;}

  .stat{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow);}
  .stat .k{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600;}
  .stat .v{font-size:22px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums;}
  .stat .v.small{font-size:16px;}

  /* Modal */
  .modal-bg{position:fixed; inset:0; background:rgba(15,25,40,.5); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:100; overflow:auto;}
  .modal{background:#fff; border-radius:10px; width:100%; max-width:720px; box-shadow:0 20px 60px rgba(0,0,0,.3); overflow:hidden;}
  .modal.wide{max-width:920px;}
  .modal .mh{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .modal .mh h3{margin:0; font-size:16px;}
  .modal .mb{padding:20px; max-height:70vh; overflow:auto;}
  .modal .mf{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; background:#fafbfc; flex-wrap:wrap;}
  .x{background:none; border:none; font-size:22px; color:var(--muted); cursor:pointer; line-height:1;}

  .chk{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink);}
  .chk input{width:auto;}
  .fieldset{border:1px solid var(--line); border-radius:6px; padding:12px; margin-top:8px;}
  .fieldset legend{font-size:12px; color:var(--muted); font-weight:600; padding:0 6px;}
  .tier-row{display:grid; grid-template-columns:1.6fr .7fr 1.4fr auto auto; gap:8px; align-items:center; margin-bottom:8px;}
  @media(max-width:760px){.tier-row{grid-template-columns:1fr 1fr;}}

  .subhead{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; margin:18px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--line);}

  /* ===== Print document (invoice / statement / retainer) — CM Advisory brand ===== */
  #docwrap{background:#4a524e; padding:26px; display:none;}
  #docwrap.show{display:block;}
  .doc{background:#fff; max-width:8.5in; margin:0 auto 22px; padding:0.6in 0.65in; box-shadow:0 6px 26px rgba(0,0,0,.35);
    color:var(--ink); font-size:11.5px; line-height:1.5;
    font-family:'Poppins','Segoe UI',Helvetica,Arial,sans-serif;}
  .doc .lbl{color:var(--stone); font-size:9px; text-transform:uppercase; letter-spacing:.08em; font-weight:600;}
  .doc .doctitle{font-size:26px; letter-spacing:.06em; font-weight:600; color:var(--doc-ink); text-transform:uppercase; margin:0;}
  .doc h1,.doc h2,.doc h3{color:var(--doc-ink);}

  /* Masthead */
  .doc .lh{display:flex; justify-content:space-between; align-items:flex-start; gap:20px;}
  .doc .lh-logo{max-height:66px; max-width:260px;}
  .doc .lh-name{font-weight:700; color:var(--doc-ink); font-size:19px; line-height:1.1; letter-spacing:.01em;}
  .doc .lh-tag{color:var(--doc-rule); font-size:9px; letter-spacing:.14em; text-transform:uppercase; margin-top:3px; font-weight:600;}
  .doc .lh-contact{font-size:10px; color:var(--stone); text-align:right; line-height:1.55;}
  .doc .lh-rule{border:none; border-top:2px solid var(--doc-rule); margin:12px 0 0;}

  /* Meta / parties */
  .doc .meta{display:flex; justify-content:space-between; gap:24px; margin-top:20px;}
  .doc .party b{font-size:12.5px; color:var(--ink);}
  .doc .metatable{font-size:11px; min-width:220px;}
  .doc .metatable td{padding:2px 0; border:none;}
  .doc .metatable td:first-child{color:var(--stone); padding-right:16px;}
  .doc .metatable td:last-child{text-align:right; font-weight:500;}

  /* Amount-due summary band */
  .doc .summary{display:flex; margin:22px 0 6px; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .doc .summary .cell{flex:1; padding:12px 16px; border-right:1px solid var(--line);}
  .doc .summary .cell:last-child{border-right:none;}
  .doc .summary .cell.due{background:var(--doc-ink); color:#fff;}
  .doc .summary .cell.due .lbl,.doc .summary .cell.due .amt{color:#fff;}
  .doc .summary .lbl{margin-bottom:3px;}
  .doc .summary .amt{font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink);}

  /* Line-item tables */
  .doc table{font-size:11px; border-collapse:collapse; width:100%;}
  .doc thead th{text-align:left; font-size:9px; text-transform:uppercase; letter-spacing:.06em; color:var(--stone);
    font-weight:600; padding:7px 8px; border-bottom:1px solid var(--line);}
  .doc tbody td{padding:7px 8px; border-bottom:1px solid #eef0ee; vertical-align:top;}
  .doc td.num,.doc th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .doc .sec-title td{background:var(--doc-ink); color:#fff; font-weight:600; text-transform:uppercase;
    letter-spacing:.06em; font-size:10px; padding:7px 10px; border:none;}
  .doc .subtot td{border-top:1px solid var(--doc-rule); border-bottom:none; padding-top:7px; font-weight:600; color:var(--ink);}
  .doc .nc{color:var(--nc); font-style:italic;}
  .doc .muted{color:var(--stone);}
  /* Per-matter grouping */
  .doc .matter-hd{margin:22px 0 0; padding:7px 10px; background:var(--doc-ink); color:#fff; font-weight:600;
    font-size:11.5px; letter-spacing:.03em; border-radius:5px 5px 0 0;}
  .doc .matter-hd .mnum{color:var(--doc-rule); font-weight:500; font-size:10px; margin-left:8px;}
  .doc .matter-sub{padding:7px 10px; margin-bottom:4px;
    background:var(--paper); border:1px solid #e6e3d9; border-top:none; border-radius:0 0 5px 5px; font-weight:600; font-size:11px; color:var(--ink);}
  .doc .matter-sub .r{display:flex; justify-content:space-between; padding:1px 0;}
  .doc .matter-sub .r.disc{color:var(--doc-ink); font-weight:500;}
  .doc .matter-sub .r.tot{border-top:1px solid #e6e3d9; margin-top:3px; padding-top:4px;}
  .doc .matter-grp table:first-of-type{margin-top:0 !important;}

  /* Totals block */
  .doc .totals{width:290px; margin-left:auto; margin-top:14px;}
  .doc .totals td{padding:3px 2px; border:none; font-size:11px;}
  .doc .totals td:last-child{text-align:right; font-variant-numeric:tabular-nums;}
  .doc .totals tr.disc td{color:var(--doc-ink);}
  .doc .totals tr.rule td{border-top:1px solid var(--line); padding-top:6px;}
  .doc .totals tr.grand td{border-top:2px solid var(--doc-ink); font-weight:700; font-size:13.5px; padding-top:7px; color:var(--doc-ink);}
  .doc .totals tr.bal td{font-weight:700; font-size:13.5px; color:var(--ink);}

  /* Notes */
  .doc .note{font-size:10px; color:#3c463f; background:#F5F6F6; border:1px solid #E3E6E8; border-left:3px solid var(--doc-ink);
    border-radius:5px; padding:9px 12px; margin-top:14px;}
  .doc .note b{color:var(--doc-ink);}
  .doc .note table td{border:none; padding:3px 8px; font-size:9.5px;}
  .doc .note table th{color:var(--stone); border-bottom:1px solid #e6e3d9; padding:3px 8px;}
  .doc .sig{margin-top:38px;}

  /* Remittance stub */
  .doc .stub{margin-top:26px; border-top:1.5px dashed var(--doc-rule); padding-top:6px;}
  .doc .stub .cut{font-size:8.5px; color:var(--stone); letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px;}
  .doc .stub .row2{display:flex; justify-content:space-between; align-items:flex-end; gap:20px;}
  .doc .stub .box{border:1px solid var(--line); border-radius:6px; padding:8px 12px; min-width:150px;}

  .docbar{position:sticky; top:0; background:var(--doc-ink); padding:10px 16px; display:flex; gap:10px; align-items:center; margin:-26px -26px 26px; z-index:5;}
  .docbar .btn{background:var(--doc-rule); color:var(--doc-ink); border-color:var(--doc-rule); font-weight:600;}
  .docbar .btn:hover{background:#d0b673;}
  .docbar .btn.sec{background:transparent; border-color:rgba(255,255,255,.3); color:#eaf0ec;}
  @media print{
    body{background:#fff;}
    #side,#main,.docbar,.noprint{display:none !important;}
    #docwrap{display:block !important; background:#fff; padding:0;}
    .doc{box-shadow:none; margin:0; max-width:none; padding:0.5in 0.55in; page-break-after:always;}
    .doc:last-child{page-break-after:auto;}
    .doc .sec-title td,.doc .summary .cell.due{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
/* ==========================================================
   Tenth brand layer  v1.0
   ========================================================== */
  body{font-family:'Geist',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased; letter-spacing:-0.006em;}
  h1,h2,h3,h4{letter-spacing:-0.02em;}
  .topbar h1{font-size:21px; letter-spacing:-0.024em;}

  /* Figures are monospaced and tabular everywhere money is shown */
  td.num, .totals td:last-child, .money,
  .doc td.num, .doc .totals td:last-child{
    font-family:'Geist Mono',ui-monospace,Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums; letter-spacing:-0.01em;}

  /* Sidebar lockup */
  #side .brand{padding:17px 18px 15px; gap:11px;}
  #side .brand .mk{flex:0 0 26px;}
  #side .brand b{font-size:17px; font-weight:600; letter-spacing:-0.03em; color:#fff;}
  #side .brand span{font-size:10px; letter-spacing:.1em; font-weight:500; color:#8B98A4;
    display:block; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px;}
  #side nav a{font-size:13px; letter-spacing:-0.004em;}
  #side nav a.active{border-left-color:var(--cobalt);}

  /* Controls */
  .btn{border-radius:6px; font-weight:500; letter-spacing:-0.008em;}
  .btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--cobalt); outline-offset:1px;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--cobalt);
    box-shadow:0 0 0 3px var(--cobalt-soft);}
  .card{border-radius:10px;}

  .stat .v, th.num, .doc th.num{font-variant-numeric:tabular-nums;}
  .stat .v{letter-spacing:-0.03em;}

  /* Trust money is never the colour of operating money */
  .tag.trust{background:var(--trust-soft); color:var(--trust);}
  .trust-figure, #trustBal td.num{color:var(--trust); font-weight:500;}

  /* Document chrome */
  .docbar{background:var(--ink);}
  .docbar .btn{background:var(--cobalt); color:#fff; border-color:var(--cobalt); font-weight:500;}
  .doc .doctitle{letter-spacing:.08em;}
  .doc .lh-tag{color:var(--doc-sub); letter-spacing:.15em;}
  .doc .lh-rule{border-top:1.5px solid var(--doc-ink);}
  .doc .summary .cell.due{background:var(--doc-band);}
  /* Section labels read as ruled headings, not filled bars — less ink, more paper */
  .doc .sec-title td{background:transparent !important; color:var(--doc-ink); font-weight:600;
    letter-spacing:.14em; font-size:9px; padding:14px 0 5px; border:none;
    border-bottom:1.2px solid var(--doc-ink);}
  .doc .matter-hd{border-radius:3px 3px 0 0; letter-spacing:.02em;}
  .doc .matter-hd .mnum{color:#AEB7BF;}
  .doc thead th{border-bottom:1px solid var(--doc-rule); color:var(--doc-sub);}
  .doc .subtot td{border-top:1px solid var(--doc-rule);}
  .doc .totals tr.grand td{border-top:1.5px solid var(--doc-ink);}

</style>
</head>

    <nav id="nav"></nav>
  </aside>
  <main id="main"></main>

<script>
/* =========================================================================
   Legal Billing & Trust Manager  —  single-file, local (localStorage) app
   Built for Michigan legal practice: itemized fees, trust/IOLTA (MRPC 1.15),
   reasonable-fee itemization (MRPC 1.5), tiered discounts.
   ========================================================================= */

/* ---------- storage ---------- */
const LS_KEY = 'legalBilling.v1';

  if(f.nextCreditNo === undefined) f.nextCreditNo = 1;
  // Move discounts from the client level to the matter level.
  (db.matters||[]).forEach(m=>{
    if(m.discount === undefined){
      const c=(db.clients||[]).find(x=>x.id===m.clientId);
      m.discount = (c && c.discount) ? JSON.parse(JSON.stringify(c.discount))
        : {type:'none', appliesTo:'hourly', note:'', tiers:[]};
    }
  });
  // Migrate existing invoices to per-matter discount snapshots/overrides.
  (db.invoices||[]).forEach(inv=>{
    if(inv.matterDiscounts === undefined){
      inv.matterDiscounts = {};
      (inv.matterIds||[]).forEach(mid=>{
        inv.matterDiscounts[mid] = {
          snapshot: inv.discountSnapshot ? JSON.parse(JSON.stringify(inv.discountSnapshot))
            : {type:'none', appliesTo:'hourly', note:'', tiers:[]},
          override: inv.discountOverride ? JSON.parse(JSON.stringify(inv.discountOverride))
            : {mode:'auto', tierId:'', customAmt:0, keepAvailable:false}
        };
      });
    }
  });
  // Multi-firm: wrap the single firm into firms[] and add Cre8, LLC as a second billing entity.
  if(!Array.isArray(db.firms)){
    if(!f.id) f.id = uid('firm');
    const cre8 = makeFirm({ name:'Cre8, LLC', invoicePrefix:'CRE-', nextInvoiceNo:1001,
      retainerPrefix:'CRE-RET-', creditPrefix:'CRE-CR-',
      logo:CRE8_LOGO, tagline:CRE8_TAGLINE, _cre8Brand:1,
      taxRate:f.taxRate, taxLabel:f.taxLabel, defaultTermsDays:f.defaultTermsDays, terms:f.terms,
      expenseMarkupDefault:f.expenseMarkupDefault, autoApplyTrust:f.autoApplyTrust,
      trustNotice:f.trustNotice, lateFee:JSON.parse(JSON.stringify(f.lateFee||{})) });
    db.firms=[f, cre8];
  }
  // Brand the Cre8 billing company (once) for installs that already had a logo-less Cre8.
  (db.firms||[]).forEach(fm=>{
    if(fm.name==='Cre8, LLC' && !fm._cre8Brand){
      if(!fm.logo) fm.logo=CRE8_LOGO;
      if(!fm.tagline) fm.tagline=CRE8_TAGLINE;
      fm._cre8Brand=1;
    }
  });
  delete db.firm; // no longer stored separately — primaryFirm() is firms[0]
  (db.clients||[]).forEach(c=>{ if(!c.firmId) c.firmId = db.firms[0].id; });
  (db.invoices||[]).forEach(inv=>{ if(!inv.firmId){ const c=(db.clients||[]).find(x=>x.id===inv.clientId); inv.firmId = (c&&c.firmId)||db.firms[0].id; } });
  return db;
}

/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const money = n => (n<0?'-$':'$') + Math.abs(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = n => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayISO = () => new Date().toISOString().slice(0,10);
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${m}/${d}/${y}`; }
function cityStateZip(city,state,zip){ const cs=[city,state].filter(Boolean).join(', '); return [cs,zip].filter(Boolean).join(' '); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function endOfMonth(iso){ const d=new Date(iso+'T00:00:00'); const e=new Date(d.getFullYear(), d.getMonth()+1, 0); return e.toISOString().slice(0,10); }
function clientById(id){ return DB.clients.find(c=>c.id===id); }
function matterById(id){ return DB.matters.find(m=>m.id===id); }
function mattersFor(clientId){ return DB.matters.filter(m=>m.clientId===clientId); }
function tkById(id){ return DB.timekeepers.find(t=>t.id===id); }
function tkLabel(id){ const t=tkById(id); return t?`${t.name} (${t.initials})`:'—'; }
/* Billing-entity resolvers */
function primaryFirm(){ return DB.firms[0]; }
function firmById(id){ return DB.firms.find(f=>f.id===id) || primaryFirm(); }
function firmOfClient(clientId){ const c=clientById(clientId); return firmById(c&&c.firmId); }
function firmOfInvoice(inv){ return firmById(inv&&(inv.firmId||firmOfClient(inv&&inv.clientId).id)); }

/* entry amount recompute (expenses may carry a markup %) */
function entryAmount(e){
  if(e.type==='hourly') return e.noCharge ? 0 : round2((Number(e.hours)||0)*(Number(e.rate)||0));
  if(e.type==='expense') return round2((Number(e.amount)||0) * (1 + (Number(e.markup)||0)/100));
  return round2(Number(e.amount)||0);
}
function round2(n){ return Math.round((Number(n)||0)*100)/100; }

function discountSummary(o){
  const d=o.discount||{type:'none'};
  if(d.type==='none') return `<span class="tag gray">None</span>`;
  const scope = d.appliesTo==='all'?'all fees':'hourly';
  if(d.type==='flat') return `<span class="tag info" title="Flat ${d.tiers?.[0]?.percent||0}% off ${scope}">Flat ${d.tiers?.[0]?.percent||0}%</span>`;
  const tiers=(d.tiers||[]).map(t=>`<span class="tag info" title="${esc(condLabel(t))}">${t.percent}%</span>`).join(' ');
  return `${tiers} <span class="small muted">(${scope})</span>`;
}
function condLabel(t){
  if(t.cond==='days') return `if paid in full within ${t.days} day(s) of invoice`;
  if(t.cond==='eom') return `if paid in full by end of invoice month`;
  if(t.cond==='date') return `if paid in full by ${fmtDate(t.byDate)}`;
  return 'always';
}

/* Reusable discount-rules editor. Appends a fieldset to `body` and mutates target.discount. */
function renderDiscountFieldset(body, target){
  if(!target.discount) target.discount={type:'none', appliesTo:'hourly', note:'', tiers:[]};
  const d=target.discount;
  const fs=document.createElement('div');
  fs.innerHTML=`<fieldset class="fieldset" style="margin-top:16px">
    <legend>Discount rules (this matter)</legend>
    <div class="grid g2">
      <div><label>Discount type</label>
        <select id="d_type">
          <option value="none">None</option>
          <option value="flat">Flat (single %)</option>
          <option value="tiered">Tiered (by payment date)</option>
        </select></div>
      <div><label>Applies to</label>
        <select id="d_applies">
          <option value="hourly">Hourly fees only</option>
          <option value="all">All fees (hourly + fixed)</option>
        </select></div>
    </div>
    <div id="tiersWrap" style="margin-top:10px"></div>
    <div><label>“Paid in full” / discount note (prints on invoice)</label>
      <textarea id="d_note">${esc(d.note||'')}</textarea></div>
  </fieldset>`;
  body.appendChild(fs);
  $('#d_type',body).value=d.type||'none'; $('#d_applies',body).value=d.appliesTo||'hourly';
  function renderTiers(){
    const type=$('#d_type',body).value;
    const wrap=$('#tiersWrap',body);
    if(type==='none'){ wrap.innerHTML=`<div class="small muted">This matter receives no discount.</div>`; return; }
    if(type==='flat'){
      if(!d.tiers[0]) d.tiers[0]={id:uid('t'),label:'Discount',percent:10,cond:'always',days:0};
      d.tiers=[d.tiers[0]];
      wrap.innerHTML=`<div class="row"><div style="max-width:160px"><label>Percent off</label>
        <input type="number" id="flat_pct" value="${d.tiers[0].percent}" min="0" max="100" step="0.5"></div>
        <div class="small muted">Applied to every invoice automatically.</div></div>`;
      $('#flat_pct',body).oninput=e=>d.tiers[0].percent=Number(e.target.value)||0;
      return;
    }
    wrap.innerHTML=`<div id="tierList"></div><button class="btn sec sm" id="addTier" type="button">＋ Add tier</button>`;
    drawTierList();
    $('#addTier',body).onclick=()=>{ d.tiers.push({id:uid('t'),label:'',percent:10,cond:'days',days:10}); drawTierList(); };
    function drawTierList(){
      const tl=$('#tierList',body);
      tl.innerHTML=d.tiers.map((t,i)=>`
        <div class="tier-row" data-i="${i}">
          <input placeholder="Label (e.g. Early payment)" class="t_label" value="${esc(t.label)}">
          <input type="number" class="t_pct" value="${t.percent}" min="0" max="100" step="0.5" title="Percent">
          <select class="t_cond">
            <option value="days"${t.cond==='days'?' selected':''}>within N days of invoice</option>
            <option value="eom"${t.cond==='eom'?' selected':''}>by end of invoice month</option>
          </select>
          <input type="number" class="t_days" value="${t.days||0}" min="0" step="1" title="Days" style="${t.cond==='days'?'':'visibility:hidden'}">
          <button class="btn ghost sm t_del" type="button" title="Remove">✕</button>
        </div>`).join('') || `<div class="small muted">No tiers.</div>`;
      tl.querySelectorAll('.tier-row').forEach(r=>{
        const i=+r.dataset.i, t=d.tiers[i];
        r.querySelector('.t_label').oninput=e=>t.label=e.target.value;
        r.querySelector('.t_pct').oninput=e=>t.percent=Number(e.target.value)||0;
        r.querySelector('.t_days').oninput=e=>t.days=Number(e.target.value)||0;
        r.querySelector('.t_cond').onchange=e=>{ t.cond=e.target.value; drawTierList(); };
        r.querySelector('.t_del').onclick=()=>{ d.tiers.splice(i,1); drawTierList(); };
      });
    }
  }
  renderTiers();
  $('#d_type',body).onchange=renderTiers;
}
/* Read the discount fieldset back into target.discount. */
function commitDiscountFieldset(target){
  if(!target.discount) target.discount={type:'none',appliesTo:'hourly',note:'',tiers:[]};
  target.discount.type=$('#d_type').value;
  target.discount.appliesTo=$('#d_applies').value;
  target.discount.note=$('#d_note').value;
  if(target.discount.type==='none') target.discount.tiers=[];
}

    save(); render(); return true;
  }, isNew?null:{delete:()=>{
    const hasFin = DB.invoices.some(i=>i.clientId===c.id) || DB.payments.some(p=>p.clientId===c.id)
      || DB.trust.some(t=>t.clientId===c.id) || DB.retainers.some(r=>r.clientId===c.id);
    if(hasFin){ alert('Cannot delete: this client has invoices, payments, retainers, or trust activity. Delete is only available for clients with no financial history — you can close its matters instead.'); return; }
    const ms=mattersFor(c.id);
    if(!confirm(`Delete client “${c.name}”${ms.length?` and its ${ms.length} matter(s)`:''} and any unbilled entries? This cannot be undone.`)) return;
    const mids=ms.map(m=>m.id);
    DB.entries=DB.entries.filter(e=>!mids.includes(e.matterId));
    DB.matters=DB.matters.filter(m=>m.clientId!==c.id);
    DB.clients=DB.clients.filter(x=>x.id!==c.id);
    save(); render(); closeModal();
  }});
}

function clientDefaultRate(clientId){

/* Next sequential file/matter number (4-digit, based on the highest numeric number in use). */

  const max=DB.matters.reduce((mx,m)=>{ const n=parseInt(String(m.number).replace(/\D/g,''),10); return (!isNaN(n)&&n>mx)?n:mx; },0);

function invStatusTag(i){
  if(i.status==='draft') return '<span class="tag gray">Draft</span>';
  if(i.status==='void') return '<span class="tag gray">Void</span>';
  const bal=invoiceBalance(i);
  if(bal<=0.005) return '<span class="tag good">Paid</span>';
  if(invoicePaid(i)>0) return '<span class="tag warn">Partial</span>';
  const overdue = invoiceAgeDays(i)>0;
  return overdue ? '<span class="tag bad">Past Due</span>' : '<span class="tag info">Open</span>';
}
/* An invoice that is a real receivable (issued and not void). Drafts are work-in-progress. */
function issued(i){ return i.status!=='draft' && i.status!=='void'; }
/* Billed amount of an entry on a specific invoice, honoring a per-line write-down. */
function billedAmount(inv, e){
  const a = inv.lineAdjust && inv.lineAdjust[e.id];
  if(a!==undefined && a!==null && a!=='') return round2(Number(a)||0);
  return entryAmount(e);
}
/* Days past due as of today (<=0 means not yet due). */
function invoiceAgeDays(i){
  const due=i.dueDate||i.date; if(!due) return 0;
  return Math.floor((new Date(todayISO()+'T00:00:00') - new Date(due+'T00:00:00'))/86400000);
}
function agingBucketKey(days){ if(days<=0) return 'current'; if(days<=30) return 'd1'; if(days<=60) return 'd31'; if(days<=90) return 'd61'; return 'd90'; }
function clientAging(clientId){
  const b={current:0,d1:0,d31:0,d61:0,d90:0,total:0};
  DB.invoices.filter(i=>i.clientId===clientId && issued(i) && invoiceBalance(i)>0.005).forEach(i=>{
    const bal=invoiceBalance(i); b[agingBucketKey(invoiceAgeDays(i))]+=bal; b.total+=bal;
  });
  Object.keys(b).forEach(k=>b[k]=round2(b[k]));
  return b;
}
/* Amount of a single payment applied to a given invoice (supports multi-invoice allocations). */
function paymentAppliedTo(p, invId){
  if(Array.isArray(p.allocations)) return round2(p.allocations.filter(a=>a.invoiceId===invId).reduce((s,a)=>s+(Number(a.amount)||0),0));
  return p.invoiceId===invId ? round2(p.amount) : 0;
}
function paymentApplied(p){
  if(Array.isArray(p.allocations)) return round2(p.allocations.reduce((s,a)=>s+(Number(a.amount)||0),0));
  return p.invoiceId ? round2(p.amount) : 0;
}
function paymentUnapplied(p){ return round2((Number(p.amount)||0) - paymentApplied(p)); }
function clientCredit(clientId){ return round2(DB.payments.filter(p=>p.clientId===clientId).reduce((s,p)=>s+paymentUnapplied(p),0)); }

function invoicePaid(i){
  const fromPay = DB.payments.reduce((s,p)=>s+paymentAppliedTo(p,i.id),0);
  const fromTrust = DB.trust.filter(t=>t.invoiceId===i.id&&t.type==='apply').reduce((s,t)=>s+t.amount,0);
  return round2(fromPay+fromTrust);
}
function invoiceBalance(i){ if(i.status==='void') return 0; return round2((i.grandTotal||0) - invoicePaid(i)); }
function openInvoicesFor(clientId){
  return DB.invoices.filter(i=>i.clientId===clientId && issued(i) && invoiceBalance(i)>0.005)
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}
/* Balance of an invoice using only payments/credits dated on or before asOf. */
function invoiceBalanceAsOf(inv, asOf){
  if(inv.status==='void') return 0;
  const paid = DB.payments.reduce((s,p)=> s + (((p.date||'')<=asOf) ? paymentAppliedTo(p,inv.id) : 0), 0)
    + DB.trust.filter(t=>t.invoiceId===inv.id && t.type==='apply' && (t.date||'')<=asOf).reduce((s,t)=>s+t.amount,0);
  return round2((inv.grandTotal||0) - paid);
}
/* Snapshot of a client's outstanding prior invoices as of a date (for "Previous Balance"). */
function prevBalanceSnapshot(clientId, asOf, excludeInvId){
  const priors = DB.invoices
    .filter(i=>i.clientId===clientId && i.id!==excludeInvId && issued(i) && (i.date||'')<=asOf)
    .map(i=>({id:i.id, number:i.number, date:i.date, matterNames:i.matterNames, balance:invoiceBalanceAsOf(i, asOf)}))
    .filter(x=>x.balance>0.005)
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  return {prevBalance:round2(priors.reduce((s,x)=>s+x.balance,0)), priors};
}

/* ---- New-invoice flow: pick client + matters, select unbilled entries ---- */
function newInvoiceFlow(){
  if(!DB.clients.length){ alert('Create a client first.'); return; }
  // Default: include ALL of the client's matters on one invoice.
  let sel = {clientId:DB.clients[0].id, firmId:firmOfClient(DB.clients[0].id).id, matterIds:new Set(mattersFor(DB.clients[0].id).map(m=>m.id)), entryIds:new Set(), date:todayISO()};
  openModal('New Invoice — select work', body=>{
    body.innerHTML=`
      <div class="grid g3">
        <div><label>Client *</label><select id="i_client">${DB.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
        <div><label>Bill from (company)</label><select id="i_firm">${DB.firms.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div>
        <div><label>Invoice date</label><input type="date" id="i_date" value="${sel.date}"></div>
      </div>
      <div class="subhead">Matters to include</div>
      <div class="small muted" style="margin-bottom:6px">All of the client’s matters are included on one invoice by default — uncheck any you want to leave off.</div>
      <div id="matterPick"></div>
      <div class="subhead">Unbilled entries</div>
      <div class="small muted" style="margin-bottom:6px">Only unbilled entries for the selected matter(s) are shown. No-charge items may be included; they print but don’t add to the total.</div>
      <div id="entryPick"></div>`;
    const cS=$('#i_client',body); cS.value=sel.clientId;
    const fS=$('#i_firm',body); fS.value=sel.firmId;
    cS.onchange=()=>{ sel.clientId=cS.value; sel.firmId=firmOfClient(cS.value).id; fS.value=sel.firmId; sel.matterIds=new Set(mattersFor(cS.value).map(m=>m.id)); sel.entryIds=new Set(); sel._touched=false; drawMatters(); drawEntries(); };
    fS.onchange=()=>{ sel.firmId=fS.value; };
    $('#i_date',body).onchange=e=>sel.date=e.target.value;
    function drawMatters(){
      const ms=mattersFor(sel.clientId);
      const w=$('#matterPick',body);
      if(!ms.length){ w.innerHTML=`<div class="small muted">This client has no matters.</div>`; return; }
      w.innerHTML=ms.map(m=>{
        const wip=unbilledEntries().filter(e=>e.matterId===m.id).length;
        return `<label class="chk" style="margin:4px 0"><input type="checkbox" class="mck" value="${m.id}" ${sel.matterIds.has(m.id)?'checked':''}>
          ${esc(m.name)} <span class="small muted">(${wip} unbilled)</span></label>`;
      }).join('');
      w.querySelectorAll('.mck').forEach(ck=>ck.onchange=()=>{ ck.checked?sel.matterIds.add(ck.value):sel.matterIds.delete(ck.value); drawEntries(); });
    }
    function drawEntries(){
      const w=$('#entryPick',body);
      const mids=[...sel.matterIds];
      if(!mids.length){ w.innerHTML=`<div class="small muted">Select at least one matter.</div>`; return; }
      const list=unbilledEntries().filter(e=>mids.includes(e.matterId)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      if(!list.length){ w.innerHTML=`<div class="small muted">No unbilled entries for the selected matter(s).</div>`; return; }
      // default select all
      list.forEach(e=>{ if(!sel._touched) sel.entryIds.add(e.id); });
      sel._touched=true;
      w.innerHTML=`<table><thead><tr><th><input type="checkbox" id="ckAll"></th><th>Date</th><th>Type</th><th>Description</th><th class="num">Amount</th></tr></thead><tbody>`+
        list.map(e=>`<tr><td><input type="checkbox" class="eck" value="${e.id}" ${sel.entryIds.has(e.id)?'checked':''}></td>
          <td class="nowrap">${fmtDate(e.date)}</td><td>${typeTag(e.type)}</td>
          <td>${esc(e.desc)} ${e.noCharge?'<span class="tag nc">No Charge</span>':''}</td>
          <td class="num">${e.noCharge?'$0.00':money(entryAmount(e))}</td></tr>`).join('')+`</tbody></table>`;
      w.querySelectorAll('.eck').forEach(ck=>ck.onchange=()=>{ ck.checked?sel.entryIds.add(ck.value):sel.entryIds.delete(ck.value); });
      $('#ckAll',body).onchange=e=>{ w.querySelectorAll('.eck').forEach(ck=>{ ck.checked=e.target.checked; ck.checked?sel.entryIds.add(ck.value):sel.entryIds.delete(ck.value); }); };
    }
    drawMatters(); drawEntries();
  }, ()=>{
    if(!sel.entryIds.size){ alert('Select at least one entry.'); return false; }
    createInvoice(sel, false);
    return true;
  }, {buttons:[
    {label:'Create & Issue', cls:'', onClick:()=>{
      if(!sel.entryIds.size){ alert('Select at least one entry.'); return; }
      createInvoice(sel, true); closeModal();
    }}
  ]}, 'Create Draft');
}

function invoiceDueDate(clientId, date){
  const c=clientById(clientId);
  const fm=firmOfClient(clientId);
  const days = (c && c.termsDays!=null) ? Number(c.termsDays) : Number(fm.defaultTermsDays);
  return (days<=0) ? date : addDays(date, days||0);
}
function createInvoice(sel, issue){
  const entryIds=[...sel.entryIds];
  const mids=[...new Set(entryIds.map(id=>DB.entries.find(e=>e.id===id).matterId))];
  const client=clientById(sel.clientId);
  const firm = firmById(sel.firmId || (client&&client.firmId));
  const number = firm.invoicePrefix + (firm.nextInvoiceNo++);
  // Snapshot each matter's discount config + a per-matter override.
  const matterDiscounts={};
  mids.forEach(mid=>{
    const m=matterById(mid);
    matterDiscounts[mid]={
      snapshot: (m && m.discount) ? JSON.parse(JSON.stringify(m.discount)) : {type:'none',appliesTo:'hourly',note:'',tiers:[]},
      override:{mode:'auto', tierId:'', customAmt:0, keepAvailable:false}
    };
  });
  const taxRate = (client && client.taxRate!=null) ? Number(client.taxRate) : Number(firm.taxRate||0);
  const inv={
    id:uid('inv'), number, clientId:sel.clientId, firmId:firm.id, matterIds:mids,
    matterNames:mids.map(id=>matterById(id)?.name).filter(Boolean).join(', '),
    date:sel.date, dueDate:invoiceDueDate(sel.clientId, sel.date),
    entryIds,
    matterDiscounts,
    lineAdjust:{}, adjustment:{amount:0, label:'Adjustment'},
    taxRate, taxLabel:(firm.taxLabel||'Sales Tax'),
    status: issue ? 'open' : 'draft', createdAt:todayISO()
  };
  computeInvoiceTotals(inv);
  // Snapshot the previous balance as of the invoice date.
  const snap = prevBalanceSnapshot(inv.clientId, inv.date, inv.id);
  inv.prevBalance = snap.prevBalance;
  inv.priorSnapshot = snap.priors;
  if(issue) recomputeInvoiceStatus(inv);
  DB.invoices.push(inv);
  entryIds.forEach(id=>{ const e=DB.entries.find(x=>x.id===id); if(e) e.invoiceId=inv.id; });
  save();
  if(issue) maybeAutoApplyTrust(inv);
  openInvoiceDoc(inv.id);
}

/* Month-end batch: create a draft invoice per selected client covering all their unbilled work. */
function batchInvoiceFlow(){
  const clientsWithWork = DB.clients.filter(c=>unbilledEntries().some(e=>matterById(e.matterId)?.clientId===c.id));
  if(!clientsWithWork.length){ alert('No clients have unbilled time or fees to invoice.'); return; }
  const sel={date:todayISO(), picked:new Set(clientsWithWork.map(c=>c.id))};
  openModal('Batch Invoice — month-end', body=>{
    body.innerHTML=`
      <div class="row" style="margin-bottom:10px"><div style="max-width:200px"><label>Invoice date</label><input type="date" id="b_date" value="${sel.date}"></div></div>
      <div class="small muted" style="margin-bottom:6px">A <b>draft</b> invoice will be created for each selected client, covering all their unbilled entries (all matters). Review and issue them from the invoice list.</div>
      <div id="b_list"></div>`;
    $('#b_date',body).onchange=e=>sel.date=e.target.value;
    const w=$('#b_list',body);
    w.innerHTML=`<table><thead><tr><th><input type="checkbox" id="b_all" checked></th><th>Client</th><th class="num">Entries</th><th class="num">Unbilled value</th></tr></thead><tbody>`+
      clientsWithWork.map(c=>{
        const es=unbilledEntries().filter(e=>matterById(e.matterId)?.clientId===c.id);
        const val=es.reduce((s,e)=>s+entryAmount(e),0);
        return `<tr><td><input type="checkbox" class="b_ck" value="${c.id}" checked></td><td>${esc(c.name)}</td><td class="num">${es.length}</td><td class="num">${money(val)}</td></tr>`;
      }).join('')+`</tbody></table>`;
    w.querySelectorAll('.b_ck').forEach(ck=>ck.onchange=()=>{ ck.checked?sel.picked.add(ck.value):sel.picked.delete(ck.value); });
    $('#b_all',body).onchange=e=>{ w.querySelectorAll('.b_ck').forEach(ck=>{ ck.checked=e.target.checked; ck.checked?sel.picked.add(ck.value):sel.picked.delete(ck.value); }); };
  }, ()=>{
    if(!sel.picked.size){ alert('Select at least one client.'); return false; }
    let n=0;
    [...sel.picked].forEach(cid=>{
      const ids=unbilledEntries().filter(e=>matterById(e.matterId)?.clientId===cid).map(e=>e.id);
      if(!ids.length) return;
      createInvoiceSilent({clientId:cid, entryIds:new Set(ids), date:sel.date});
      n++;
    });
    save(); render();
    alert(`Created ${n} draft invoice(s). Review and issue them from the list.`);
    return true;
  }, null, 'Create Drafts');
}
/* Like createInvoice but does not open the document (used for batch). Always creates a draft. */
function createInvoiceSilent(sel){
  const entryIds=[...sel.entryIds];
  const mids=[...new Set(entryIds.map(id=>DB.entries.find(e=>e.id===id).matterId))];
  const client=clientById(sel.clientId);
  const firm=firmById(sel.firmId || (client&&client.firmId));
  const number = firm.invoicePrefix + (firm.nextInvoiceNo++);
  const matterDiscounts={};
  mids.forEach(mid=>{ const m=matterById(mid); matterDiscounts[mid]={snapshot:(m&&m.discount)?JSON.parse(JSON.stringify(m.discount)):{type:'none',appliesTo:'hourly',note:'',tiers:[]}, override:{mode:'auto',tierId:'',customAmt:0,keepAvailable:false}}; });
  const taxRate=(client&&client.taxRate!=null)?Number(client.taxRate):Number(firm.taxRate||0);
  const inv={id:uid('inv'), number, clientId:sel.clientId, firmId:firm.id, matterIds:mids,
    matterNames:mids.map(id=>matterById(id)?.name).filter(Boolean).join(', '),
    date:sel.date, dueDate:invoiceDueDate(sel.clientId, sel.date), entryIds, matterDiscounts,
    lineAdjust:{}, adjustment:{amount:0,label:'Adjustment'}, taxRate, taxLabel:(firm.taxLabel||'Sales Tax'),
    status:'draft', createdAt:todayISO()};
  computeInvoiceTotals(inv);
  const snap=prevBalanceSnapshot(inv.clientId, inv.date, inv.id); inv.prevBalance=snap.prevBalance; inv.priorSnapshot=snap.priors;
  DB.invoices.push(inv);
  entryIds.forEach(id=>{ const e=DB.entries.find(x=>x.id===id); if(e) e.invoiceId=inv.id; });
}
/* Generate this month's recurring charges as fixed-fee entries (idempotent per month). */
function generateRecurringFlow(){
  const active=DB.recurring.filter(r=>r.active && r.matterId && r.amount>0);
  if(!active.length){ alert('No active recurring charges. Add them under Firm Settings → Recurring Charges.'); return; }
  const month=todayISO().slice(0,7);
  const monthName=new Date(todayISO()+'T00:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const due=active.filter(r=>r.lastMonth!==month);
  openModal('Generate Recurring Charges', body=>{
    body.innerHTML=`
      <div class="small muted" style="margin-bottom:8px">Post a fixed-fee entry for each active recurring charge for <b>${esc(monthName)}</b>. Already-generated items this month are skipped.</div>
      ${due.length? `<table><thead><tr><th>Client / Matter</th><th>Description</th><th class="num">Amount</th></tr></thead><tbody>`+
        due.map(r=>`<tr><td>${esc((clientById(r.clientId)?.name||'')+' — '+(matterById(r.matterId)?.name||''))}</td><td>${esc(r.description)}</td><td class="num">${money(r.amount)}</td></tr>`).join('')+
        `</tbody></table>` : `<div class="small muted">All recurring charges for ${esc(monthName)} have already been generated.</div>`}`;
  }, ()=>{
    if(!due.length) return true;
    due.forEach(r=>{
      DB.entries.push({id:uid('en'), matterId:r.matterId, type:'fixed', date:todayISO(), tkId:'', desc:r.description, hours:0, rate:0, amount:round2(r.amount), noCharge:false, ncNote:'', invoiceId:null});
      r.lastMonth=month;
    });
    save(); render();
    alert(`Posted ${due.length} recurring charge(s) as unbilled fixed-fee entries. Bill them individually or via Batch invoice.`);
    return true;
  }, null, due.length?'Generate':'Close');
}

/* When an invoice is issued, offer to draw the client's available trust balance against it. */
function maybeAutoApplyTrust(inv){
  if(!firmOfInvoice(inv).autoApplyTrust || !issued(inv)) return;
  const tb=trustBalance(inv.clientId), bal=invoiceBalance(inv);
  if(tb<=0.005 || bal<=0.005) return;
  const amt=round2(Math.min(tb,bal));
  if(confirm(`This client has ${money(tb)} in trust. Apply ${money(amt)} to ${inv.number} now?`)){
    DB.trust.push({id:uid('tr'), clientId:inv.clientId, matterId:(inv.matterIds&&inv.matterIds[0])||null, date:todayISO(),
      type:'apply', amount:amt, note:'Applied to invoice '+inv.number, invoiceId:inv.id});
    recomputeInvoiceStatus(inv); save();
  }
}

/* compute stored totals for list views (uses selected/effective discount) */
function computeInvoiceTotals(inv){
  const b=invoiceBreakdown(inv);
  inv.hourlyCharged=b.hourlyCharged; inv.fixedTotal=b.fixedTotal; inv.expenseTotal=b.expenseTotal;
  inv.discountAmount=b.discountApplied; inv.grandTotal=b.grandTotal;
}

/* Compute discount options + effective discount for one discount config + override. */
function computeDiscount(d, override, base, invDate){
  d = d||{type:'none'};
  let options=[];
  if(d.type==='flat' && d.tiers?.[0]){
    options.push({id:d.tiers[0].id, label:d.tiers[0].label||'Discount', percent:d.tiers[0].percent, deadline:null, condText:'Applied to this invoice'});
  }else if(d.type==='tiered'){
    options=(d.tiers||[]).map(t=>{
      let deadline=null, condText='';
      if(t.cond==='days'){ deadline=addDays(invDate, t.days||0); condText=`if paid in full within ${t.days} day(s) — by ${fmtDate(deadline)}`; }
      else if(t.cond==='eom'){ deadline=endOfMonth(invDate); condText=`if paid in full by end of invoice month — by ${fmtDate(deadline)}`; }
      return {id:t.id, label:t.label||'Discount', percent:t.percent, deadline, condText};
    });
  }
  options.forEach(o=>o.amount=round2(base*o.percent/100));
  const ov=override||{mode:'auto'};
  let effPercent=0, effLabel='', effId='', effAmount=0;
  if(ov.mode==='custom'){
    // Custom override is a flat dollar amount, capped at the discountable base.
    effAmount = round2(Math.max(0, Math.min(Number(ov.customAmt)||0, base)));
    effPercent = base>0 ? round2(effAmount/base*100) : 0;
    effLabel='Discount (manual override)'; effId='custom';
  }
  else if(ov.mode==='none'){ effAmount=0; }
  else if(ov.mode==='tier'){ const o=options.find(x=>x.id===ov.tierId); if(o){ effPercent=o.percent; effLabel=o.label; effId=o.id; effAmount=round2(base*effPercent/100); } }
  else {
    const today=todayISO();
    const avail=options.filter(o=>!o.deadline || o.deadline>=today || ov.keepAvailable);
    if(avail.length){ const best=avail.reduce((a,b)=>b.percent>a.percent?b:a); effPercent=best.percent; effLabel=best.label; effId=best.id; effAmount=round2(base*effPercent/100); }
  }
  return {options, effAmount, effPercent, effLabel, effId};
}

/* full breakdown incl. per-matter discounts */
function invoiceBreakdown(inv){
  const entries = inv.entryIds.map(id=>DB.entries.find(e=>e.id===id)).filter(Boolean);
  const mids = (inv.matterIds && inv.matterIds.length) ? inv.matterIds : [...new Set(entries.map(e=>e.matterId))];
  const md = inv.matterDiscounts||{};
  const matters = mids.map(mid=>{
    const es=entries.filter(e=>e.matterId===mid);
    const hourly=es.filter(e=>e.type==='hourly');
    const fixed=es.filter(e=>e.type==='fixed');
    const expense=es.filter(e=>e.type==='expense');
    const hourlyCharged=round2(hourly.filter(e=>!e.noCharge).reduce((s,e)=>s+billedAmount(inv,e),0));
    const fixedTotal=round2(fixed.reduce((s,e)=>s+billedAmount(inv,e),0));
    const expenseTotal=round2(expense.reduce((s,e)=>s+billedAmount(inv,e),0));
    const conf = md[mid] || {snapshot:{type:'none',appliesTo:'hourly',note:'',tiers:[]}, override:{mode:'auto'}};
    const d = conf.snapshot||{type:'none'};
    const base = (d.appliesTo==='all') ? (hourlyCharged+fixedTotal) : hourlyCharged;
    const disc = computeDiscount(d, conf.override, base, inv.date);
    return {mid, m:matterById(mid), entries:es, hourly, fixed, expense,
      hourlyCharged, fixedTotal, expenseTotal, subtotal:round2(hourlyCharged+fixedTotal+expenseTotal),
      d, override:conf.override||{mode:'auto'}, base,
      options:disc.options, discountApplied:disc.effAmount, discountPercent:disc.effPercent, discountLabel:disc.effLabel, discountId:disc.effId};
  });
  const hourly = entries.filter(e=>e.type==='hourly');
  const fixed  = entries.filter(e=>e.type==='fixed');
  const expense= entries.filter(e=>e.type==='expense');
  const hourlyCharged = round2(matters.reduce((s,x)=>s+x.hourlyCharged,0));
  const fixedTotal = round2(matters.reduce((s,x)=>s+x.fixedTotal,0));
  const expenseTotal = round2(matters.reduce((s,x)=>s+x.expenseTotal,0));
  const subtotal = round2(hourlyCharged + fixedTotal + expenseTotal);
  const discountApplied = round2(matters.reduce((s,x)=>s+x.discountApplied,0));
  const adjustment = round2((inv.adjustment && Number(inv.adjustment.amount)) || 0);
  const preTax = round2(subtotal - discountApplied - adjustment);
  const taxRate = Number(inv.taxRate||0);
  const tax = round2(preTax * taxRate/100);
  const grand = round2(preTax + tax);
  return {entries, matters, hourly, fixed, expense, hourlyCharged, fixedTotal, expenseTotal,
    subtotal, discountApplied, adjustment, preTax, taxRate, tax, taxLabel:(inv.taxLabel||primaryFirm().taxLabel||'Sales Tax'), grandTotal:grand};
}

/* ---- payments ---- */
const PAY_METHODS = ['Check','ACH / Wire','Credit Card','Cash','Trust Transfer','Other'];

/* Quick entry from an invoice: preselect that invoice. */
function recordPayment(invId){
  const inv=DB.invoices.find(i=>i.id===invId);
  applyPaymentFlow({clientId:inv.clientId, focusInvoiceId:inv.id});
}

/* Apply a payment (or credit memo) to a client's account, allocating across open invoices. */
function applyPaymentFlow(opts={}){
  if(!DB.clients.length){ alert('Create a client first.'); return; }
  const kind = opts.kind||'payment';
  const isCredit = kind==='credit';
  const noun = isCredit?'Credit':'Payment';
  const state = {
    id:uid('pay'),
    clientId: opts.clientId || DB.clients[0].id,
    date: todayISO(),
    amount: 0,
    method: isCredit?'Credit Memo':'Check',
    note: '',
    alloc: {}  // invoiceId -> amount
  };
  openModal(isCredit?'Issue Credit Memo':'Apply Payment', body=>{
    body.innerHTML=`
      <div class="grid g3">
        <div><label>Client *</label><select id="p_client">${DB.clients.map(c=>`<option value="${c.id}"${c.id===state.clientId?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
        <div><label>${noun} date</label><input type="date" id="p_date" value="${state.date}"></div>
        ${isCredit?`<div><label>Type</label><input value="Credit Memo" disabled></div>`
          :`<div><label>Method</label><select id="p_method">${PAY_METHODS.map(m=>`<option${m===state.method?' selected':''}>${m}</option>`).join('')}</select></div>`}
        <div style="grid-column:1/-1"><label>${isCredit?'Reason for credit':'Reference / note (check no., confirmation, etc.)'}</label><input id="p_note" value=""></div>
      </div>
      <div class="row" style="margin-top:12px;align-items:center">
        <div style="max-width:180px"><label>${noun} amount</label><input type="number" id="p_amt" value="0" step="0.01" min="0"></div>
        <button class="btn sec sm" id="p_auto" type="button">Auto-apply to oldest</button>
        <button class="btn ghost sm" id="p_clear" type="button">Clear allocations</button>
      </div>
      <div class="subhead">Apply to open invoices</div>
      <div id="p_allocWrap"></div>
      <div id="p_recap" class="note" style="margin-top:12px"></div>`;
    const cS=$('#p_client',body), amtI=$('#p_amt',body);
    cS.onchange=()=>{ state.clientId=cS.value; state.alloc={}; if($('#p_method',body)) state.method=$('#p_method',body).value; drawAlloc(); };
    amtI.oninput=()=>{ state.amount=Number(amtI.value)||0; recap(); };
    $('#p_auto',body).onclick=()=>autoApply();
    $('#p_clear',body).onclick=()=>{ state.alloc={}; drawAlloc(); };

    function invoicesList(){ return openInvoicesFor(state.clientId); }
    function allocSum(){ return round2(Object.values(state.alloc).reduce((s,v)=>s+(Number(v)||0),0)); }

    function drawAlloc(){
      const w=$('#p_allocWrap',body);
      const list=invoicesList();
      if(!list.length){ w.innerHTML=`<div class="small muted">No open invoices for this client. The full amount will be recorded as an unapplied credit on the client's account.</div>`; recap(); return; }
      w.innerHTML=`<table><thead><tr><th>Invoice</th><th>Date</th><th class="num">Balance</th><th class="num" style="width:130px">Apply</th></tr></thead><tbody>`+
        list.map(i=>`<tr>
          <td><b>${esc(i.number)}</b><br><span class="small muted">${esc(i.matterNames||'')}</span></td>
          <td class="nowrap">${fmtDate(i.date)}</td>
          <td class="num">${money(invoiceBalance(i))}</td>
          <td class="num"><input type="number" class="p_al" data-inv="${i.id}" value="${state.alloc[i.id]!=null?state.alloc[i.id]:''}" step="0.01" min="0" style="text-align:right"></td>
        </tr>`).join('')+`</tbody></table>`;
      w.querySelectorAll('.p_al').forEach(inp=>inp.oninput=()=>{
        const id=inp.dataset.inv, v=Number(inp.value)||0;
        if(v>0) state.alloc[id]=round2(v); else delete state.alloc[id];
        recap();
      });
      recap();
    }
    function autoApply(){
      let remaining = state.amount>0 ? state.amount : invoicesList().reduce((s,i)=>s+invoiceBalance(i),0);
      if(state.amount<=0){ state.amount=round2(remaining); amtI.value=state.amount; }
      remaining = state.amount;
      state.alloc={};
      for(const i of invoicesList()){
        if(remaining<=0.005) break;
        const bal=invoiceBalance(i); const use=Math.min(bal, remaining);
        if(use>0){ state.alloc[i.id]=round2(use); remaining=round2(remaining-use); }
      }
      drawAlloc();
    }
    function recap(){
      const applied=allocSum(), unapplied=round2((state.amount||0)-applied);
      const el=$('#p_recap',body);
      const over = applied>(state.amount||0)+0.005;
      el.innerHTML=`${noun}: <b>${money(state.amount||0)}</b> &nbsp;·&nbsp; Applied to invoices: <b>${money(applied)}</b> &nbsp;·&nbsp;
        ${over?`<span style="color:var(--bad)"><b>Over-applied by ${money(applied-(state.amount||0))}</b> — reduce allocations.</span>`
             :`Unapplied credit: <b>${money(unapplied)}</b>`}`;
      el.style.borderLeftColor = over ? 'var(--bad)' : 'var(--cobalt)';
    }
    drawAlloc();
    if(opts.focusInvoiceId){ const inv=DB.invoices.find(i=>i.id===opts.focusInvoiceId); if(inv){ state.amount=invoiceBalance(inv); amtI.value=state.amount; autoApply(); } }
  }, ()=>{
    state.date=$('#p_date').value; if($('#p_method')) state.method=$('#p_method').value; state.note=$('#p_note').value;
    state.amount=Number($('#p_amt').value)||0;
    if(state.amount<=0){ alert(`Enter a ${noun.toLowerCase()} amount.`); return false; }
    const applied=round2(Object.values(state.alloc).reduce((s,v)=>s+(Number(v)||0),0));
    if(applied>state.amount+0.005){ alert('Allocations exceed the amount. Reduce the amounts applied.'); return false; }
    const allocations=Object.entries(state.alloc).filter(([,v])=>Number(v)>0).map(([invoiceId,amount])=>({invoiceId, amount:round2(amount)}));
    const rec={id:state.id, clientId:state.clientId, date:state.date, amount:round2(state.amount),
      method:state.method, note:state.note, allocations, kind};
    if(isCredit){ const fm=firmOfClient(state.clientId); rec.number=fm.creditPrefix+(fm.nextCreditNo++); }
    DB.payments.push(rec);
    allocations.forEach(a=>{ const inv=DB.invoices.find(i=>i.id===a.invoiceId); if(inv) recomputeInvoiceStatus(inv); });
    save(); render(); return true;
  }, null, isCredit?'Issue Credit Memo':'Record Payment');
}

/* Record a refund of an overpayment/credit back to the client (reduces available credit). */
function refundFlow(opts={}){
  if(!DB.clients.length){ alert('Create a client first.'); return; }
  const state={id:uid('pay'), clientId:opts.clientId||DB.clients[0].id, date:todayISO(), amount:0, method:'Check', note:''};
  openModal('Record Refund', body=>{
    const drawCredit=cid=>`Available credit on account: <b>${money(clientCredit(cid))}</b>`;
    body.innerHTML=`
      <div class="grid g3">
        <div><label>Client *</label><select id="r_client">${DB.clients.map(c=>`<option value="${c.id}"${c.id===state.clientId?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
        <div><label>Refund date</label><input type="date" id="r_date" value="${state.date}"></div>
        <div><label>Method</label><select id="r_method">${PAY_METHODS.filter(m=>m!=='Trust Transfer').map(m=>`<option>${m}</option>`).join('')}</select></div>
        <div style="max-width:180px"><label>Refund amount</label><input type="number" id="r_amt" value="0" step="0.01" min="0"></div>
        <div style="grid-column:1/-1"><label>Note</label><input id="r_note" value="Refund of overpayment / unapplied credit"></div>
      </div>
      <div class="note" id="r_credit" style="margin-top:10px">${drawCredit(state.clientId)}</div>`;
    $('#r_client',body).onchange=e=>{ state.clientId=e.target.value; $('#r_credit',body).innerHTML=drawCredit(state.clientId); };
  }, ()=>{
    state.clientId=$('#r_client').value; state.date=$('#r_date').value; state.method=$('#r_method').value; state.note=$('#r_note').value;
    state.amount=Number($('#r_amt').value)||0;
    if(state.amount<=0){ alert('Enter a refund amount.'); return false; }
    DB.payments.push({id:state.id, clientId:state.clientId, date:state.date, amount:-round2(state.amount),
      method:state.method, note:state.note, allocations:[], kind:'refund'});
    save(); render(); return true;
  }, null, 'Record Refund');
}

function recomputeInvoiceStatus(inv){

}

/* Render the three fee-type section tables. `billed` maps an entry to its billed amount (write-downs). */
function invFeeSections(entries, billed){
  billed = billed || entryAmount;
  const hourly=entries.filter(e=>e.type==='hourly');
  const fixed=entries.filter(e=>e.type==='fixed');
  const expense=entries.filter(e=>e.type==='expense');
  const hc=round2(hourly.filter(e=>!e.noCharge).reduce((s,e)=>s+billed(e),0));
  const ft=round2(fixed.reduce((s,e)=>s+billed(e),0));
  const et=round2(expense.reduce((s,e)=>s+billed(e),0));
  const wd=(e)=>{ const b=billed(e), o=entryAmount(e); return (!e.noCharge && b<o-0.005) ? `<div class="muted" style="font-size:9.5px">Written down from ${money(o)}</div>` : ''; };
  const hourlySection = hourly.length ? `
    <table style="margin-top:16px">
      <thead>
        <tr class="sec-title"><td colspan="6">Professional Services — Hourly Fees</td></tr>
        <tr><th style="width:66px">Date</th><th style="width:38px">Atty</th><th>Description</th><th class="num" style="width:46px">Hours</th><th class="num" style="width:66px">Rate</th><th class="num" style="width:78px">Amount</th></tr>
      </thead>
      <tbody>
        ${hourly.map(e=>`<tr>
          <td class="nowrap">${fmtDate(e.date)}</td><td>${esc(tkById(e.tkId)?.initials||'')}</td>
          <td>${esc(e.desc)}${e.noCharge?`<div class="nc">No Charge — ${esc(e.ncNote||'')}</div>`:wd(e)}</td>
          <td class="num">${num(e.hours)}</td><td class="num">${money(e.rate)}</td>
          <td class="num">${e.noCharge?`<span class="nc">N/C</span>`:money(billed(e))}</td></tr>`).join('')}
        <tr class="subtot"><td colspan="5" class="num">Total Hourly Fees</td><td class="num">${money(hc)}</td></tr>
      </tbody>
    </table>` : '';
  const fixedSection = fixed.length ? `
    <table style="margin-top:16px">
      <thead>
        <tr class="sec-title"><td colspan="3">Fixed Fees</td></tr>
        <tr><th style="width:66px">Date</th><th>Description</th><th class="num" style="width:78px">Amount</th></tr>
      </thead>
      <tbody>
        ${fixed.map(e=>`<tr><td class="nowrap">${fmtDate(e.date)}</td><td>${esc(e.desc)}${wd(e)}</td><td class="num">${money(billed(e))}</td></tr>`).join('')}
        <tr class="subtot"><td colspan="2" class="num">Total Fixed Fees</td><td class="num">${money(ft)}</td></tr>
      </tbody>
    </table>` : '';
  const expenseSection = expense.length ? `
    <table style="margin-top:16px">
      <thead>
        <tr class="sec-title"><td colspan="3">Out-of-Pocket Expenses (Costs Advanced)</td></tr>
        <tr><th style="width:66px">Date</th><th>Description</th><th class="num" style="width:78px">Amount</th></tr>
      </thead>
      <tbody>
        ${expense.map(e=>`<tr><td class="nowrap">${fmtDate(e.date)}</td><td>${esc(e.desc)}${(Number(e.markup)>0)?`<div class="muted" style="font-size:9.5px">Cost ${money(e.amount)} + ${num(e.markup)}% markup</div>`:''}${wd(e)}</td><td class="num">${money(billed(e))}</td></tr>`).join('')}
        <tr class="subtot"><td colspan="2" class="num">Total Expenses</td><td class="num">${money(et)}</td></tr>
      </tbody>
    </table>` : '';
  return {html:hourlySection+fixedSection+expenseSection, subtotal:round2(hc+ft+et)};
}

/* Build the line-item body: grouped by matter (with per-matter discount) when the invoice spans several. */
function invItemsHtml(inv, b){
  const billed = (e)=>billedAmount(inv, e);
  if(b.matters.length > 1){
    return b.matters.filter(mt=>mt.entries.length).map(mt=>{
      const m=mt.m;
      const fs=invFeeSections(mt.entries, billed);
      const net=round2(mt.subtotal - mt.discountApplied);
      const discRows = mt.discountApplied>0.005
        ? `<div class="r disc"><span>Less discount${mt.discountId==='custom'?'':` (${num(mt.discountPercent)}%)`}</span><span>-${money(mt.discountApplied)}</span></div>
           <div class="r tot"><span>Matter total — ${esc(m?m.name:'')}</span><span>${money(net)}</span></div>`
        : '';
      return `<div class="matter-grp">
        <div class="matter-hd">${esc(m?m.name:'Matter')}${m&&m.number?`<span class="mnum">File No. ${esc(m.number)}</span>`:''}</div>
        ${fs.html}
        <div class="matter-sub">
          <div class="r"><span>Matter subtotal — ${esc(m?m.name:'')}</span><span>${money(mt.subtotal)}</span></div>
          ${discRows}
        </div>
      </div>`;
    }).join('');
  }
  return invFeeSections(b.entries, billed).html;
}

function openInvoiceDoc(invId){
  const inv=DB.invoices.find(i=>i.id===invId); if(!inv) return;
  computeInvoiceTotals(inv); save();
  const c=clientById(inv.clientId);
  const firm=firmOfInvoice(inv);
  const b=invoiceBreakdown(inv);
  const paid=invoicePaid(inv), bal=invoiceBalance(inv);

  // Previous balance is a snapshot captured at invoice creation, as of the invoice date.
  // Migrate any older invoice that predates snapshots by freezing one now.
  if(inv.priorSnapshot===undefined){
    const snap = prevBalanceSnapshot(inv.clientId, inv.date, inv.id);
    inv.prevBalance = snap.prevBalance; inv.priorSnapshot = snap.priors; save();
  }
  const priorInvoices = inv.priorSnapshot || [];
  const prevBalance = round2(inv.prevBalance||0);
  const totalOwed = round2(prevBalance + bal);

  // Discount line label: a single % when one matter is discounted, else a plain "Discounts".
  const discMatters = b.matters.filter(m=>m.discountApplied>0.005);
  const discTotalLabel = discMatters.length===1
    ? (discMatters[0].discountId==='custom' ? 'Discount' : `Discount (${num(discMatters[0].discountPercent)}%)`)
    : 'Less: Discounts';

  const trustBal = trustBalance(inv.clientId);
  const isDraft = inv.status==='draft';
  const overdue = issued(inv) && bal>0.005 && invoiceAgeDays(inv)>0;

    <div class="docbar noprint">

      <table class="totals">
