        ${b.discountApplied>0?`<tr class="disc"><td>${esc(discTotalLabel)}</td><td>-${money(b.discountApplied)}</td></tr>`:''}
        ${b.adjustment>0.005?`<tr class="disc"><td>${esc(inv.adjustment?.label||'Adjustment')} (write-down)</td><td>-${money(b.adjustment)}</td></tr>`:''}
        ${b.tax>0.005?`<tr class="rule"><td>Net charges</td><td>${money(b.preTax)}</td></tr>
        <tr><td>${esc(b.taxLabel)} (${num(b.taxRate)}%)</td><td>${money(b.tax)}</td></tr>`:''}
        <tr class="rule"><td>Current Charges</td><td>${money(b.grandTotal)}</td></tr>
        ${paid>0?`<tr><td>Payments &amp; credits applied to this invoice</td><td>-${money(paid)}</td></tr>
        <tr><td>Balance, this invoice</td><td>${money(bal)}</td></tr>`:''}
        ${prevBalance>0.005?`<tr><td>Previous balance (as of ${fmtDate(inv.date)})</td><td>${money(prevBalance)}</td></tr>`:''}
        <tr class="grand"><td>Total Balance Due</td><td>${money(totalOwed)}</td></tr>
      </table>

      ${discountNotice(inv,b)}
      ${trustBal>0?`<div class="note">Client trust (IOLTA) balance available: <b>${money(trustBal)}</b>. ${esc(firm.trustNotice)}</div>`:''}
      <div class="note"><b>Terms.</b> ${esc(firm.terms)}</div>
      <div class="small muted" style="margin-top:14px">This invoice itemizes fees and costs in accordance with the Michigan Rules of Professional Conduct (MRPC 1.5). Please contact our office with any questions.</div>

      <div class="stub">
        <div class="cut">Please detach and return this portion with your payment</div>
        <div class="row2">
          <div>
            <div class="lbl">Remit payment to</div>
            <div><b>${esc(firm.name)}</b><br>${esc(firm.line1)}<br>${esc(cityStateZip(firm.city,firm.state,firm.zip))}</div>
          </div>
          <div class="box">
            <table class="metatable">
              <tr><td>Invoice No.</td><td>${esc(inv.number)}</td></tr>
              <tr><td>Client</td><td>${esc(c?.name||'')}</td></tr>
              <tr><td>This Invoice Balance</td><td>${money(bal)}</td></tr>
              ${prevBalance>0.005?`<tr><td>Previous Balance</td><td>${money(prevBalance)}</td></tr>`:''}
              <tr><td>Total Balance Due</td><td><b>${money(totalOwed)}</b></td></tr>
              <tr><td>Amount Enclosed</td><td>$ __________</td></tr>
            </table>
          </div>
        </div>
      </div>
    </div>`;
  showDoc(doc);
  const on=(id,fn)=>{ const el=$('#'+id); if(el) el.onclick=fn; };
  on('payBtn',()=>recordPayment(inv.id));
  on('backBtn',()=>{ DB.ui.tab='invoices'; save(); render(); });
  on('editDisc',()=>editDiscount(inv));
  on('applyTrustBtn',()=>applyTrustToInvoice(inv));
  on('editLinesBtn',()=>editInvoiceLines(inv));
  on('finalizeBtn',()=>{
    if(!inv.entryIds.length){ alert('Add at least one line before issuing.'); return; }
    if(!confirm(`Finalize and issue ${inv.number}? It becomes a receivable and is locked from line edits.`)) return;
    inv.status='open';
    const snap=prevBalanceSnapshot(inv.clientId, inv.date, inv.id);
    inv.prevBalance=snap.prevBalance; inv.priorSnapshot=snap.priors;
    recomputeInvoiceStatus(inv); save(); maybeAutoApplyTrust(inv); openInvoiceDoc(inv.id);
  });
  on('reopenBtn',()=>{
    if(invoicePaid(inv)>0.005){ alert('Cannot reopen: payments or trust credits are applied to this invoice. Remove them first.'); return; }
    inv.status='draft'; save(); openInvoiceDoc(inv.id);
  });
  on('voidBtn',()=>{ inv.status = inv.status==='void'?'open':'void'; if(inv.status!=='void') recomputeInvoiceStatus(inv); save(); openInvoiceDoc(inv.id); });
}

/* Edit a DRAFT invoice: add/remove lines, per-line write-downs, and an invoice-level adjustment. */
function editInvoiceLines(inv){
  if(inv.status!=='draft'){ alert('Only draft invoices can be edited. Reopen it as a draft first.'); return; }
  // Candidate entries: those already on this invoice + this client's unbilled entries.
  const cand = DB.entries.filter(e=>{
    const m=matterById(e.matterId); if(!m || m.clientId!==inv.clientId) return false;
    return e.invoiceId===inv.id || !e.invoiceId;
  }).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const state = {
    inc:new Set(inv.entryIds),
    adj:Object.assign({}, inv.lineAdjust||{}),
    adjAmt:(inv.adjustment&&inv.adjustment.amount)||0,
    adjLabel:(inv.adjustment&&inv.adjustment.label)||'Adjustment'
  };
  openModal('Edit Invoice — '+inv.number, body=>{
    body.innerHTML=`
      <div class="small muted" style="margin-bottom:8px">Check the lines to include. Set a lower <b>Bill</b> amount to write a line down; leave it to bill in full.</div>
      <div id="lineWrap"></div>
      <fieldset class="fieldset" style="margin-top:12px"><legend>Invoice-level adjustment (write-down)</legend>
        <div class="row">
          <div style="max-width:220px"><label>Label</label><input id="adj_label" value="${esc(state.adjLabel)}"></div>
          <div style="max-width:150px"><label>Amount off ($)</label><input type="number" id="adj_amt" value="${state.adjAmt}" step="0.01" min="0"></div>
        </div>
      </fieldset>
      <div id="lineRecap" class="note" style="margin-top:10px"></div>`;
    $('#adj_label',body).oninput=e=>{ state.adjLabel=e.target.value; };
    $('#adj_amt',body).oninput=e=>{ state.adjAmt=Number(e.target.value)||0; recap(); };
    function draw(){
      const w=$('#lineWrap',body);
      if(!cand.length){ w.innerHTML=`<div class="small muted">No entries available for this client.</div>`; return; }
      w.innerHTML=`<table><thead><tr><th></th><th>Date</th><th>Matter</th><th>Type</th><th>Description</th><th class="num">Full</th><th class="num" style="width:96px">Bill</th></tr></thead><tbody>`+
        cand.map(e=>{
          const m=matterById(e.matterId);
          const on=state.inc.has(e.id);
          const billVal = state.adj[e.id]!=null ? state.adj[e.id] : '';
          return `<tr>
            <td><input type="checkbox" class="lc" value="${e.id}" ${on?'checked':''}></td>
            <td class="nowrap">${fmtDate(e.date)}</td>
            <td class="small">${esc(m?m.name:'')}</td>
            <td>${typeTag(e.type)}</td>
            <td>${esc(e.desc)}${e.noCharge?' <span class="tag nc">No Charge</span>':''}</td>
            <td class="num">${e.noCharge?'$0.00':money(entryAmount(e))}</td>
            <td class="num"><input type="number" class="la" data-id="${e.id}" value="${billVal}" placeholder="${e.noCharge?'0.00':num(entryAmount(e))}" step="0.01" min="0" style="text-align:right" ${on&&!e.noCharge?'':'disabled'}></td>
          </tr>`;
        }).join('')+`</tbody></table>`;
      w.querySelectorAll('.lc').forEach(ck=>ck.onchange=()=>{ ck.checked?state.inc.add(ck.value):state.inc.delete(ck.value); draw(); });
      w.querySelectorAll('.la').forEach(inp=>inp.oninput=()=>{ const id=inp.dataset.id, v=inp.value.trim(); if(v==='') delete state.adj[id]; else state.adj[id]=round2(Number(v)||0); recap(); });
      recap();
    }
    function recap(){
      let sub=0;
      cand.forEach(e=>{ if(!state.inc.has(e.id)) return; const full=entryAmount(e); const b=(state.adj[e.id]!=null)?Math.min(state.adj[e.id],full):full; sub+=b; });
      const grand=round2(sub-(state.adjAmt||0));
      $('#lineRecap',body).innerHTML=`Lines: <b>${state.inc.size}</b> &nbsp;·&nbsp; Charges after write-downs: <b>${money(round2(sub))}</b>${state.adjAmt>0?` &nbsp;·&nbsp; less adjustment ${money(state.adjAmt)}`:''} &nbsp;·&nbsp; <b>Current charges: ${money(grand)}</b>`;
    }
    draw();
  }, ()=>{
    const newIds=cand.filter(e=>state.inc.has(e.id)).map(e=>e.id);
    if(!newIds.length){ alert('Select at least one line.'); return false; }
    // Reassign entry ownership
    const wasOn=new Set(inv.entryIds);
    newIds.forEach(id=>{ const e=DB.entries.find(x=>x.id===id); if(e) e.invoiceId=inv.id; });
    inv.entryIds.forEach(id=>{ if(!state.inc.has(id)){ const e=DB.entries.find(x=>x.id===id); if(e) e.invoiceId=null; } });
    inv.entryIds=newIds;
    // Line write-downs (only keep for included, non-noCharge, and below full)
    const la={};
    newIds.forEach(id=>{ const e=DB.entries.find(x=>x.id===id); if(!e||e.noCharge) return; const v=state.adj[id]; if(v!=null && v<entryAmount(e)-0.005) la[id]=round2(v); });
    inv.lineAdjust=la;
    inv.adjustment={amount:round2(state.adjAmt||0), label:state.adjLabel||'Adjustment'};
    // Recompute matters + discount snapshots for the current matter set
    const mids=[...new Set(newIds.map(id=>DB.entries.find(e=>e.id===id).matterId))];
    inv.matterIds=mids;
    inv.matterNames=mids.map(id=>matterById(id)?.name).filter(Boolean).join(', ');
    inv.matterDiscounts=inv.matterDiscounts||{};
    mids.forEach(mid=>{ if(!inv.matterDiscounts[mid]){ const m=matterById(mid); inv.matterDiscounts[mid]={snapshot:(m&&m.discount)?JSON.parse(JSON.stringify(m.discount)):{type:'none',appliesTo:'hourly',note:'',tiers:[]}, override:{mode:'auto',tierId:'',customAmt:0,keepAvailable:false}}; } });
    Object.keys(inv.matterDiscounts).forEach(mid=>{ if(!mids.includes(mid)) delete inv.matterDiscounts[mid]; });
    computeInvoiceTotals(inv); save(); openInvoiceDoc(inv.id); return true;
  }, null, 'Save Draft');
}

function discountControls(){ return ''; }
function discountNotice(inv,b){
  const withOpts=b.matters.filter(mt=>mt.options && mt.options.length);
  if(!withOpts.length) return '';
  const multi=b.matters.length>1;
  return withOpts.map(mt=>{
    const d=mt.d;
    const rows=mt.options.map(o=>{
      const net=round2(mt.subtotal - o.amount);
      return `<tr><td>${esc(o.label)}</td><td>${esc(o.condText)}</td><td class="num">${num(o.percent)}%</td><td class="num">-${money(o.amount)}</td><td class="num"><b>${money(net)}</b></td></tr>`;
    }).join('');
    return `<div class="note">
      <b>Discount${multi&&mt.m?` — ${esc(mt.m.name)}`:''}.</b> ${d.appliesTo==='all'?'Applies to hourly and fixed fees.':'Applies to hourly fees only.'}
      ${d.note?`<div style="margin:4px 0">${esc(d.note)}</div>`:''}
      <table style="margin-top:6px"><tr><th>Discount</th><th>Condition</th><th class="num">Rate</th><th class="num">Savings</th><th class="num">Net ${multi?'matter':'current'} charges</th></tr>${rows}</table>
      ${mt.override?.keepAvailable?`<div style="margin-top:6px"><i>Discount eligibility extended by the firm; the above remains available notwithstanding the stated deadline.</i></div>`:''}
    </div>`;
  }).join('');
}

function editDiscount(inv){
  const b=invoiceBreakdown(inv);
  const withDisc=b.matters.filter(mt=>mt.d && mt.d.type!=='none');
  openModal('Discount — '+inv.number, body=>{
    if(!withDisc.length){ body.innerHTML=`<div class="small muted">No matter on this invoice has a discount configured. Set a matter's discount rules under Clients &amp; Matters.</div>`; return; }
    body.innerHTML=`<div class="small muted" style="margin-bottom:10px">Choose how each matter's discount applies to this invoice. “Automatic” selects the best tier still within its deadline as of today (${fmtDate(todayISO())}).</div>`+
      withDisc.map((mt,idx)=>{
        const ov=(inv.matterDiscounts[mt.mid]&&inv.matterDiscounts[mt.mid].override)||{mode:'auto'};
        return `<fieldset class="fieldset" style="margin-bottom:12px"><legend>${esc(mt.m?mt.m.name:'Matter')}</legend>
          <label class="chk" style="margin:5px 0"><input type="radio" name="ovm_${idx}" value="auto" ${ov.mode==='auto'?'checked':''}> Automatic (deadline-based)</label>
          <label class="chk" style="margin:5px 0"><input type="radio" name="ovm_${idx}" value="none" ${ov.mode==='none'?'checked':''}> No discount applied</label>
          ${mt.options.map(o=>`<label class="chk" style="margin:5px 0"><input type="radio" name="ovm_${idx}" value="tier:${o.id}" ${ov.mode==='tier'&&ov.tierId===o.id?'checked':''}> Force apply: ${esc(o.label)} (${num(o.percent)}% = -${money(o.amount)})</label>`).join('')}
          <label class="chk" style="margin:5px 0"><input type="radio" name="ovm_${idx}" value="custom" ${ov.mode==='custom'?'checked':''}> Custom override — flat $ <input type="number" id="ovamt_${idx}" value="${ov.customAmt!=null?ov.customAmt:(ov.customPct?round2(mt.base*ov.customPct/100):0)}" step="0.01" min="0" style="width:100px;margin:0 6px"> off <span class="small muted">(discountable fees: ${money(mt.base)})</span></label>
          <label class="chk" style="margin-top:6px"><input type="checkbox" id="ovkeep_${idx}" ${ov.keepAvailable?'checked':''}> Extend eligibility past deadline</label>
        </fieldset>`;
      }).join('');
  }, ()=>{
    withDisc.forEach((mt,idx)=>{
      if(!inv.matterDiscounts[mt.mid]) inv.matterDiscounts[mt.mid]={snapshot:mt.d, override:{}};
      const ov=inv.matterDiscounts[mt.mid].override||(inv.matterDiscounts[mt.mid].override={});
      const v=document.querySelector(`input[name="ovm_${idx}"]:checked`)?.value||'auto';
      if(v==='auto'){ ov.mode='auto'; ov.tierId=''; }
      else if(v==='none'){ ov.mode='none'; ov.tierId=''; }
      else if(v==='custom'){ ov.mode='custom'; ov.customAmt=Number(document.getElementById('ovamt_'+idx).value)||0; delete ov.customPct; }
      else if(v.startsWith('tier:')){ ov.mode='tier'; ov.tierId=v.slice(5); }
      ov.keepAvailable=document.getElementById('ovkeep_'+idx).checked;
    });
    computeInvoiceTotals(inv); save(); openInvoiceDoc(inv.id); return true;
  });
}

function applyTrustToInvoice(inv){
  const bal=invoiceBalance(inv);
  const tb=trustBalance(inv.clientId);
  if(tb<=0){ alert('No trust funds available for this client.'); return; }
  let amt=Math.min(bal,tb);
  openModal('Apply Trust to '+inv.number, body=>{
    body.innerHTML=`<div class="grid g2">
      <div><label>Amount to apply</label><input type="number" id="t_amt" value="${round2(amt)}" step="0.01"></div>
      <div><label>Date</label><input type="date" id="t_date" value="${todayISO()}"></div>
    </div>
    <div class="note small muted" style="margin-top:10px">Trust available: <b>${money(tb)}</b> · Invoice balance: <b>${money(bal)}</b>.
    Applying trust records a disbursement from the client’s IOLTA account to fees/costs earned (MRPC 1.15).</div>`;
  }, ()=>{
    amt=Number($('#t_amt').value)||0;
    if(amt<=0){ alert('Enter an amount.'); return false; }
    if(amt>tb+0.005){ alert('Exceeds available trust balance.'); return false; }
    DB.trust.push({id:uid('tr'), clientId:inv.clientId, matterId:inv.matterIds[0]||null, date:$('#t_date').value,
      type:'apply', amount:round2(amt), note:'Applied to invoice '+inv.number, invoiceId:inv.id});
    recomputeInvoiceStatus(inv); save(); openInvoiceDoc(inv.id); return true;
  });
}

/* =========================================================================
   RETAINERS & TRUST
   ========================================================================= */
function trustBalance(clientId){
  return round2(DB.trust.filter(t=>t.clientId===clientId).reduce((s,t)=>{
    if(t.type==='deposit') return s+t.amount;
    if(t.type==='apply'||t.type==='refund') return s-t.amount;
    if(t.type==='adjust') return s+t.amount;
    return s;
  },0));
}
function viewTrust(main){
  main.innerHTML=`
    <div class="topbar"><div><h1>Retainers &amp; Trust</h1><div class="sub">Client trust / IOLTA ledger and retainer requests (MRPC 1.15)</div></div>
      <div class="pill-row">
        <button class="btn" id="newRet">＋ Retainer Request</button>
        <button class="btn sec" id="newDeposit">＋ Record Deposit</button>
      </div></div>
    <div class="grid g2">
      <div class="card"><h3>Trust Balances by Client</h3><div id="trustBal"></div></div>
      <div class="card"><h3>Retainer Requests</h3><div id="retList"></div></div>
    </div>
    <div class="card"><h3>Trust Ledger <span class="r"><select id="ledgerClient" style="width:auto"></select></span></h3><div id="ledger"></div></div>`;
  $('#newRet').onclick=()=>editRetainer();
  $('#newDeposit').onclick=()=>recordTrust('deposit');

  $('#trustBal').innerHTML = DB.clients.length? `<table><thead><tr><th>Client</th><th class="num">Balance</th><th></th></tr></thead><tbody>`+
    DB.clients.map(c=>`<tr><td>${esc(c.name)}</td><td class="num">${money(trustBalance(c.id))}</td>
      <td class="right"><button class="btn ghost sm" data-refund="${c.id}">Refund</button></td></tr>`).join('')+`</tbody></table>`
    : `<div class="empty">No clients.</div>`;
  $('#trustBal').querySelectorAll('[data-refund]').forEach(b=>b.onclick=()=>recordTrust('refund',b.dataset.refund));

  const rl=$('#retList');
  rl.innerHTML = DB.retainers.length? `<table><thead><tr><th>No.</th><th>Client</th><th class="num">Amount</th><th>Status</th><th></th></tr></thead><tbody>`+
    DB.retainers.slice().reverse().map(r=>`<tr><td><b>${esc(r.number)}</b><br><span class="small muted">${fmtDate(r.date)}</span></td>
      <td>${esc(clientById(r.clientId)?.name||'—')}<br><span class="small muted">${esc(matterById(r.matterId)?.name||'')}</span></td>
      <td class="num">${money(r.amount)}</td>
      <td>${r.status==='funded'?'<span class="tag good">Funded</span>':'<span class="tag warn">Requested</span>'}</td>
      <td class="right nowrap"><button class="btn ghost sm" data-openret="${r.id}">Open</button>
        ${r.status!=='funded'?`<button class="btn ghost sm" data-fund="${r.id}">Mark funded</button>`:''}</td></tr>`).join('')+`</tbody></table>`
    : `<div class="empty">No retainer requests.</div>`;
  rl.querySelectorAll('[data-openret]').forEach(b=>b.onclick=()=>openRetainerDoc(b.dataset.openret));
  rl.querySelectorAll('[data-fund]').forEach(b=>b.onclick=()=>fundRetainer(b.dataset.fund));

  const lc=$('#ledgerClient');
  lc.innerHTML=`<option value="">All clients</option>`+DB.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  lc.value=viewTrust._lc||''; lc.onchange=()=>{ viewTrust._lc=lc.value; drawLedger(); };
  drawLedger();
  function drawLedger(){
    let tx=DB.trust.slice();
    if(viewTrust._lc) tx=tx.filter(t=>t.clientId===viewTrust._lc);
    tx.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const w=$('#ledger');
    if(!tx.length){ w.innerHTML=`<div class="empty">No trust transactions.</div>`; return; }
    let run={};
    w.innerHTML=`<table><thead><tr><th>Date</th><th>Client</th><th>Type</th><th>Description</th><th class="num">In</th><th class="num">Out</th><th class="num">Balance</th><th></th></tr></thead><tbody>`+
      tx.map(t=>{
        const inAmt=(t.type==='deposit'||t.type==='adjust'&&t.amount>=0)?t.amount:0;
        const outAmt=(t.type==='apply'||t.type==='refund'||(t.type==='adjust'&&t.amount<0))?Math.abs(t.amount):0;
        run[t.clientId]=(run[t.clientId]||0)+(t.type==='deposit'?t.amount:t.type==='adjust'?t.amount:-t.amount);
        return `<tr><td class="nowrap">${fmtDate(t.date)}</td><td class="small">${esc(clientById(t.clientId)?.name||'')}</td>
          <td>${trustTypeTag(t.type)}</td><td>${esc(t.note||'')}</td>
          <td class="num">${inAmt?money(inAmt):''}</td><td class="num">${outAmt?money(outAmt):''}</td>
          <td class="num">${money(run[t.clientId])}</td>
          <td class="right">${t.invoiceId?'':`<button class="btn ghost sm" data-deltr="${t.id}">✕</button>`}</td></tr>`;
      }).join('')+`</tbody></table>`;
    w.querySelectorAll('[data-deltr]').forEach(b=>b.onclick=()=>{ if(confirm('Delete this trust transaction?')){ DB.trust=DB.trust.filter(x=>x.id!==b.dataset.deltr); save(); render(); } });
  }
}
function trustTypeTag(t){ return t==='deposit'?'<span class="tag good">Deposit</span>':t==='apply'?'<span class="tag info">Applied</span>':t==='refund'?'<span class="tag warn">Refund</span>':'<span class="tag gray">Adjust</span>'; }

function recordTrust(type, clientId){
  let t={id:uid('tr'), clientId:clientId||DB.clients[0]?.id||'', matterId:null, date:todayISO(), type, amount:0, note:type==='deposit'?'Retainer deposit into trust':type==='refund'?'Refund of unearned trust to client':'', invoiceId:null};
  if(!DB.clients.length){ alert('Create a client first.'); return; }
  openModal(type==='deposit'?'Record Trust Deposit':type==='refund'?'Record Trust Refund':'Trust Adjustment', body=>{
    body.innerHTML=`<div class="grid g2">
      <div><label>Client</label><select id="t_client">${DB.clients.map(c=>`<option value="${c.id}"${c.id===t.clientId?' selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div><label>Date</label><input type="date" id="t_date" value="${t.date}"></div>
      <div><label>Amount</label><input type="number" id="t_amt" value="0" step="0.01"></div>
      <div><label>Note</label><input id="t_note" value="${esc(t.note)}"></div>
    </div>
    ${type==='refund'?`<div class="note small muted" style="margin-top:10px">Refunds reduce the trust balance. Refund only unearned funds to the client (MRPC 1.15/1.16).</div>`:''}`;
  }, ()=>{
    t.clientId=$('#t_client').value; t.date=$('#t_date').value; t.amount=round2(Number($('#t_amt').value)||0); t.note=$('#t_note').value;
    if(t.amount<=0){ alert('Enter a positive amount.'); return false; }
    if(type==='refund' && t.amount>trustBalance(t.clientId)+0.005){ alert('Refund exceeds trust balance.'); return false; }
    DB.trust.push(t); save(); render(); return true;
  });
}

function editRetainer(){
  if(!DB.clients.length){ alert('Create a client first.'); return; }
  let r={id:uid('ret'), number:'', clientId:DB.clients[0].id,
    matterId:mattersFor(DB.clients[0].id)[0]?.id||'', date:todayISO(), amount:0,
    purpose:'advance fees and costs to be held in the firm’s IOLTA client trust account and applied to fees and expenses as earned or incurred', status:'requested'};
  openModal('New Retainer Request', body=>{
    const drawMatters=(cid,selId)=>mattersFor(cid).map(m=>`<option value="${m.id}"${m.id===selId?' selected':''}>${esc(m.name)}</option>`).join('');
    body.innerHTML=`<div class="grid g2">

function pastDueBalance(clientId, graceDays){
  return round2(DB.invoices.filter(i=>i.clientId===clientId && issued(i) && invoiceBalance(i)>0.005 && invoiceAgeDays(i)>graceDays)
    .reduce((s,i)=>s+invoiceBalance(i),0));
}
/* Assess finance charges on past-due balances; posts a fixed-fee entry per eligible client (once/month). */
function assessLateFeesFlow(){
  if(!DB.firms.some(f=>f.lateFee&&f.lateFee.enabled)){ alert('Enable finance charges for a company under Firm Settings → Billing Defaults first.'); return; }
  const month=todayISO().slice(0,7);
  const cand=DB.clients.map(c=>{
    const lf=firmOfClient(c.id).lateFee||{};
    if(!lf.enabled || c.lastFinanceCharge===month) return null;
    const base=pastDueBalance(c.id, lf.graceDays||0);
    if(base<=0.005) return null;
    const charge = lf.type==='flat' ? round2(lf.rate||0) : round2(base*(lf.rate||0)/100);
    if(charge<=0.005) return null;
    // charge posts to the matter of the oldest overdue invoice, else the client's first matter
    const overdue=DB.invoices.filter(i=>i.clientId===c.id && issued(i) && invoiceBalance(i)>0.005 && invoiceAgeDays(i)>(lf.graceDays||0)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const matterId=(overdue[0]?.matterIds?.[0]) || mattersFor(c.id)[0]?.id;
    if(!matterId) return null;
    return {c, base, charge, matterId, label:lf.label||'Finance charge on past-due balance'};
  }).filter(Boolean);
  openModal('Assess Finance Charges', body=>{
    body.innerHTML=`
      <div class="small muted" style="margin-bottom:8px">Finance charges on balances past due, as of ${fmtDate(todayISO())}, using each client's billing company rate. Posts one fixed-fee charge per client (once this month).</div>
      ${cand.length? `<table><thead><tr><th>Client</th><th class="num">Past-due base</th><th class="num">Finance charge</th></tr></thead><tbody>`+
        cand.map(x=>`<tr><td>${esc(x.c.name)}</td><td class="num">${money(x.base)}</td><td class="num">${money(x.charge)}</td></tr>`).join('')+
        `</tbody></table>` : `<div class="small muted">No eligible past-due balances to assess this month.</div>`}`;
  }, ()=>{
    if(!cand.length) return true;
    cand.forEach(x=>{
      DB.entries.push({id:uid('en'), matterId:x.matterId, type:'fixed', date:todayISO(), tkId:'', desc:x.label, hours:0, rate:0, amount:x.charge, noCharge:false, ncNote:'', invoiceId:null});
      x.c.lastFinanceCharge=month;
    });
    save(); render();
    alert(`Posted ${cand.length} finance charge(s) as unbilled fixed-fee entries. Bill them via the next invoice or Batch invoice.`);
    return true;
  }, null, cand.length?'Assess & Post':'Close');
}

function csvEscape(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function downloadCSV(filename, rows){
  const csv=rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=filename; a.click(); URL.revokeObjectURL(a.href);
}

function inPeriod(dateISO, period){
  if(period==='all' || !dateISO) return true;
  const now=todayISO();
  if(period==='ytd') return dateISO.slice(0,4)===now.slice(0,4);
  if(period==='mtd') return dateISO.slice(0,7)===now.slice(0,7);
  return true;
}
function collectionsSummary(period){
  const issuedInv=DB.invoices.filter(i=>issued(i));
  const billed=round2(issuedInv.filter(i=>inPeriod(i.date,period)).reduce((s,i)=>s+(i.grandTotal||0),0));
  let cash=0, credits=0, refunds=0;
  DB.payments.filter(p=>inPeriod(p.date,period)).forEach(p=>{
    if(p.kind==='credit') credits+=p.amount;
    else if(p.kind==='refund') refunds+=Math.abs(p.amount);
    else cash+=p.amount;
  });
  return {billed, cash:round2(cash), credits:round2(credits), refunds:round2(refunds), netCash:round2(cash-refunds)};
}
function revenueByClient(period){
  return DB.clients.map(c=>{
    const billed=round2(DB.invoices.filter(i=>issued(i)&&i.clientId===c.id&&inPeriod(i.date,period)).reduce((s,i)=>s+(i.grandTotal||0),0));
    return {c, billed};
  }).filter(x=>x.billed>0.005).sort((a,b)=>b.billed-a.billed);
}

  main.querySelectorAll('[data-stmt]').forEach(b=>b.onclick=()=>openStatementDoc(b.dataset.stmt));
  main.querySelectorAll('[data-remind]').forEach(b=>b.onclick=()=>openStatementDoc(b.dataset.remind, {reminder:true}));
  $('#periodSel').onchange=e=>{ viewReports._period=e.target.value; viewReports(main); };
  const al=$('#assessLate'); if(al) al.onclick=()=>assessLateFeesFlow();
  $('#csvInv').onclick=exportInvoicesCSV;
  $('#csvPay').onclick=exportPaymentsCSV;
  $('#csvTime').onclick=exportTimeCSV;
}

/* =========================================================================
   FIRM SETTINGS
   ========================================================================= */
function viewSettings(main){
  if(!DB.ui.settingsFirmId || !DB.firms.some(x=>x.id===DB.ui.settingsFirmId)) DB.ui.settingsFirmId=primaryFirm().id;
  const f=firmById(DB.ui.settingsFirmId);
  const clientsUsing=cid=>DB.clients.filter(c=>c.firmId===cid).length;
  main.innerHTML=`
    <div class="topbar"><div><h1>Firm Settings</h1><div class="sub">Billing companies, trust accounts, numbering, and defaults</div></div></div>
    <div class="card"><h3>Billing Company
        <span class="r">
          <select id="firmSel" style="width:auto">${DB.firms.map(x=>`<option value="${x.id}"${x.id===f.id?' selected':''}>${esc(x.name)}${x.id===primaryFirm().id?' (primary)':''}</option>`).join('')}</select>
          <button class="btn sm sec" id="addFirm">＋ Add company</button>
          ${DB.firms.length>1?`<button class="btn sm danger" id="delFirm">Remove</button>`:''}
        </span></h3>
      <div class="small muted">Each company has its own letterhead, invoice numbering, trust account, tax, terms, and late-fee settings. Assign a company to each client under Clients &amp; Matters. Editing below applies to <b>${esc(f.name)}</b>.</div>
    </div>
    <div class="card"><h3>Company Information — ${esc(f.name)}</h3>
      <div class="grid g2">
        <div><label>Company name</label><input id="f_name" value="${esc(f.name)}"></div>
        <div><label>Attorney / Bar No.</label><input id="f_bar" value="${esc(f.barNo)}"></div>
        <div><label>Address line</label><input id="f_line1" value="${esc(f.line1)}"></div>
        <div class="grid g3" style="gap:8px">
          <div><label>City</label><input id="f_city" value="${esc(f.city)}"></div>
          <div><label>State</label><input id="f_state" value="${esc(f.state)}"></div>
          <div><label>ZIP</label><input id="f_zip" value="${esc(f.zip)}"></div>
        </div>
        <div><label>Phone</label><input id="f_phone" value="${esc(f.phone)}"></div>
        <div><label>Facsimile</label><input id="f_fax" value="${esc(f.fax||'')}"></div>
        <div><label>Website</label><input id="f_web" value="${esc(f.website||'')}"></div>
        <div><label>Email</label><input id="f_email" value="${esc(f.email)}"></div>
        <div><label>EIN / Tax ID</label><input id="f_ein" value="${esc(f.ein)}"></div>
      </div>
      <div class="hr"></div>
      <div class="row" style="align-items:center">
        <div><label>Letterhead logo (optional)</label>
          <input type="file" id="f_logofile" accept="image/*" style="max-width:280px"></div>
        <div id="logoPrev">${f.logo?`<img src="${esc(f.logo)}" style="max-height:56px;max-width:120px;border:1px solid var(--line);border-radius:4px;padding:2px;background:#fff">`:'<span class="small muted">No logo</span>'}</div>
        ${f.logo?`<div><button class="btn ghost sm" id="f_logoclear">Remove logo</button></div>`:''}
      </div>
      <div class="small muted" style="margin-top:6px">This company’s logo (or, if none, its name in the brand emerald) prints at the top-left of its invoices, statements, and retainer requests.</div>
    </div>
    <div class="card"><h3>Client Trust (IOLTA) Account</h3>
      <div class="grid g2">
        <div><label>Trust bank name</label><input id="f_tbank" value="${esc(f.trustBank)}"></div>
        <div><label>Trust account (last 4 / reference)</label><input id="f_tacct" value="${esc(f.trustAcct)}"></div>
        <div style="grid-column:1/-1"><label>Trust notice (prints on invoices, statements, retainer requests)</label><textarea id="f_tnotice">${esc(f.trustNotice)}</textarea></div>
      </div>
    </div>
    <div class="card"><h3>Numbering &amp; Terms</h3>
      <div class="grid g3">
        <div><label>Invoice prefix</label><input id="f_iprefix" value="${esc(f.invoicePrefix)}"></div>
        <div><label>Next invoice number</label><input type="number" id="f_inext" value="${f.nextInvoiceNo}"></div>
        <div><label>Default payment terms</label>
          <select id="f_termsdays">
            <option value="0"${f.defaultTermsDays<=0?' selected':''}>Due on receipt</option>
            <option value="15"${f.defaultTermsDays==15?' selected':''}>Net 15</option>
            <option value="30"${f.defaultTermsDays==30?' selected':''}>Net 30</option>
            <option value="45"${f.defaultTermsDays==45?' selected':''}>Net 45</option>
            <option value="60"${f.defaultTermsDays==60?' selected':''}>Net 60</option>
          </select></div>
        <div><label>Retainer prefix</label><input id="f_rprefix" value="${esc(f.retainerPrefix)}"></div>
        <div><label>Next retainer number</label><input type="number" id="f_rnext" value="${f.nextRetainerNo}"></div>
        <div><label>Credit-memo prefix</label><input id="f_cprefix" value="${esc(f.creditPrefix||'CM-')}"></div>
        <div style="grid-column:1/-1"><label>Payment-terms text (prints on invoices)</label><textarea id="f_terms">${esc(f.terms)}</textarea></div>
      </div>
    </div>
    <div class="card"><h3>Billing Defaults</h3>
      <div class="grid g3">
        <div><label>Sales tax %</label><input type="number" id="f_taxrate" value="${f.taxRate||0}" step="0.001" min="0"></div>
        <div><label>Tax label</label><input id="f_taxlabel" value="${esc(f.taxLabel||'Sales Tax')}"></div>
        <div><label>Default expense markup %</label><input type="number" id="f_markup" value="${f.expenseMarkupDefault||0}" step="1" min="0"></div>
      </div>
      <label class="chk" style="margin-top:10px"><input type="checkbox" id="f_autotrust" ${f.autoApplyTrust?'checked':''}> Offer to apply available trust when an invoice is issued</label>
      <fieldset class="fieldset" style="margin-top:12px"><legend>Late fees / finance charges</legend>
        <label class="chk"><input type="checkbox" id="f_latefee_on" ${f.lateFee?.enabled?'checked':''}> Enable finance charges on past-due balances</label>
        <div class="grid g4" style="margin-top:8px">
          <div><label>Type</label><select id="f_latefee_type"><option value="percent"${f.lateFee?.type==='percent'?' selected':''}>Percent / month</option><option value="flat"${f.lateFee?.type==='flat'?' selected':''}>Flat amount</option></select></div>
          <div><label>Rate / amount</label><input type="number" id="f_latefee_rate" value="${f.lateFee?.rate||0}" step="0.1" min="0"></div>
          <div><label>Grace days past due</label><input type="number" id="f_latefee_grace" value="${f.lateFee?.graceDays||0}" step="1" min="0"></div>
          <div><label>Charge label</label><input id="f_latefee_label" value="${esc(f.lateFee?.label||'Finance charge on past-due balance')}"></div>
        </div>
      </fieldset>
    </div>
    <div class="card"><h3>Recurring Charges</h3>
      <div class="small muted" style="margin-bottom:8px">Fixed monthly fees. Use “Generate recurring” on the Invoices page each month to post them as fixed-fee entries, ready to bill.</div>
      <div id="recurList"></div>
      <button class="btn sec sm" id="addRecur" style="margin-top:8px">＋ Add recurring charge</button></div>
    <div class="card"><h3>Timekeepers / Rates</h3><div id="tkList"></div>
      <button class="btn sec sm" id="addTk" style="margin-top:8px">＋ Add timekeeper</button></div>
    <div class="card"><h3>Description Templates</h3>
      <div class="small muted" style="margin-bottom:8px">Reusable narrative phrases available from the “Insert template…” menu when adding time, fee, or expense entries.</div>
      <div id="phraseList"></div>
      <button class="btn sec sm" id="addPhrase" style="margin-top:8px">＋ Add template</button></div>
    <div class="row"><button class="btn" id="saveSettings">Save Settings</button>
      <span id="savedMsg" class="tag good" style="display:none;align-self:center">Saved ✓</span></div>
    <div class="card" style="margin-top:18px"><h3>Data</h3>
      <div class="pill-row">
        <button class="btn sec" id="exportBtn">⬇ Export backup (JSON)</button>
        <button class="btn sec" id="importBtn">⬆ Import backup</button>
        <input type="file" id="importFile" accept="application/json" style="display:none">
        <button class="btn danger" id="resetBtn">Reset all data</button>
      </div>
      <div class="small muted" style="margin-top:8px">All data is stored locally in this browser (localStorage). Export regularly to back up.</div>
    </div>`;
  drawTk();
  $('#addTk').onclick=()=>{ DB.timekeepers.push({id:uid('tk'),name:'',initials:'',rate:0,active:true}); save(); drawTk(); };
  drawPhrases();
  $('#addPhrase').onclick=()=>{ DB.phrases.push(''); save(); drawPhrases(); };
  function drawPhrases(){
    const w=$('#phraseList');
    if(!DB.phrases.length){ w.innerHTML=`<div class="small muted">No templates.</div>`; return; }
    w.innerHTML=DB.phrases.map((p,i)=>`<div class="row" style="margin-bottom:6px" data-i="${i}">
      <input class="ph_txt" value="${esc(p)}" style="flex:1;min-width:220px">
      <button class="btn ghost sm ph_del">✕</button></div>`).join('');
    w.querySelectorAll('[data-i]').forEach(r=>{
      const i=+r.dataset.i;
      r.querySelector('.ph_txt').oninput=e=>{ DB.phrases[i]=e.target.value; save(); };
      r.querySelector('.ph_del').onclick=()=>{ DB.phrases.splice(i,1); save(); drawPhrases(); };
    });
  }
  drawRecur();
  $('#addRecur').onclick=()=>{ DB.recurring.push({id:uid('rc'),clientId:DB.clients[0]?.id||'',matterId:'',description:'Monthly advisory fee',amount:0,active:true,lastMonth:''}); save(); drawRecur(); };
  function drawRecur(){
    const w=$('#recurList');
    if(!DB.recurring.length){ w.innerHTML=`<div class="small muted">No recurring charges.</div>`; return; }
    w.innerHTML=`<table><thead><tr><th>Client / Matter</th><th>Description</th><th class="num">Amount</th><th>Active</th><th></th></tr></thead><tbody>`+
      DB.recurring.map((r,i)=>`<tr data-i="${i}">
        <td><select class="rc_matter" style="min-width:200px">${DB.matters.map(m=>`<option value="${m.id}"${m.id===r.matterId?' selected':''}>${esc((clientById(m.clientId)?.name||'')+' — '+m.name)}</option>`).join('')}</select></td>
        <td><input class="rc_desc" value="${esc(r.description)}" style="min-width:180px"></td>
        <td class="num"><input type="number" class="rc_amt" value="${r.amount}" step="0.01" style="max-width:110px;text-align:right"></td>
        <td><input type="checkbox" class="rc_active" ${r.active?'checked':''}></td>
        <td class="right"><button class="btn ghost sm rc_del">✕</button></td></tr>`).join('')+`</tbody></table>`;
    w.querySelectorAll('tr[data-i]').forEach(row=>{
      const r=DB.recurring[+row.dataset.i];
      row.querySelector('.rc_matter').onchange=e=>{ r.matterId=e.target.value; const m=matterById(r.matterId); r.clientId=m?m.clientId:''; save(); };
      row.querySelector('.rc_desc').oninput=e=>{ r.description=e.target.value; save(); };
      row.querySelector('.rc_amt').oninput=e=>{ r.amount=Number(e.target.value)||0; save(); };
      row.querySelector('.rc_active').onchange=e=>{ r.active=e.target.checked; save(); };
      row.querySelector('.rc_del').onclick=()=>{ if(confirm('Remove this recurring charge?')){ DB.recurring.splice(+row.dataset.i,1); save(); drawRecur(); } };
    });
  }
  $('#saveSettings').onclick=()=>{
    const g=id=>$('#'+id).value;
    Object.assign(f,{name:g('f_name'),barNo:g('f_bar'),line1:g('f_line1'),city:g('f_city'),state:g('f_state'),zip:g('f_zip'),
      phone:g('f_phone'),fax:g('f_fax'),website:g('f_web'),email:g('f_email'),ein:g('f_ein'),trustBank:g('f_tbank'),trustAcct:g('f_tacct'),trustNotice:g('f_tnotice'),
      invoicePrefix:g('f_iprefix'),nextInvoiceNo:Number(g('f_inext'))||1001,retainerPrefix:g('f_rprefix'),nextRetainerNo:Number(g('f_rnext'))||1,
      creditPrefix:g('f_cprefix')||'CM-',
      defaultTermsDays:Number(g('f_termsdays')),
      taxRate:Number(g('f_taxrate'))||0, taxLabel:g('f_taxlabel')||'Sales Tax',
      expenseMarkupDefault:Number(g('f_markup'))||0,
      autoApplyTrust:$('#f_autotrust').checked,
      lateFee:{enabled:$('#f_latefee_on').checked, type:g('f_latefee_type'), rate:Number(g('f_latefee_rate'))||0, graceDays:Number(g('f_latefee_grace'))||0, label:g('f_latefee_label')||'Finance charge on past-due balance'},
      terms:g('f_terms')});
    save(); const m=$('#savedMsg'); m.style.display='inline-block'; setTimeout(()=>m.style.display='none',1500); render();
  };
  $('#firmSel').onchange=e=>{ DB.ui.settingsFirmId=e.target.value; save(); viewSettings(main); };
  $('#addFirm').onclick=()=>{
    const name=prompt('New billing company name:'); if(!name||!name.trim()) return;
    const nf=makeFirm({name:name.trim(), logo:'', tagline:'', invoicePrefix:'INV-', retainerPrefix:'RET-', creditPrefix:'CM-'});
    DB.firms.push(nf); DB.ui.settingsFirmId=nf.id; save(); viewSettings(main);
  };
  const df=$('#delFirm'); if(df) df.onclick=()=>{
    if(DB.firms.length<=1){ alert('Keep at least one company.'); return; }
    const used=clientsUsing(f.id) || DB.invoices.some(i=>i.firmId===f.id);
    if(used){ alert('Cannot remove: this company is assigned to clients or used on invoices. Reassign those first.'); return; }
    if(f.id===primaryFirm().id){ alert('Cannot remove the primary company. Only additional companies can be removed.'); return; }
    if(!confirm(`Remove billing company “${f.name}”?`)) return;
    DB.firms=DB.firms.filter(x=>x.id!==f.id); DB.ui.settingsFirmId=primaryFirm().id; save(); viewSettings(main);
  };
  $('#f_logofile').onchange=ev=>{
    const file=ev.target.files[0]; if(!file) return;
    if(file.size>600000){ alert('Please use a logo image under ~600 KB.'); return; }
    const rd=new FileReader();
    rd.onload=()=>{ f.logo=rd.result; save(); viewSettings(main); };
    rd.readAsDataURL(file);
  };
  const lc=$('#f_logoclear'); if(lc) lc.onclick=()=>{ f.logo=''; save(); viewSettings(main); };
  $('#exportBtn').onclick=exportData;
  $('#importBtn').onclick=()=>$('#importFile').click();
  $('#importFile').onchange=importData;
  $('#resetBtn').onclick=()=>{ if(confirm('Erase ALL data and restore the sample database? This cannot be undone.')){ localStorage.removeItem(LS_KEY); DB=seed(); save(); render(); } };

  function drawTk(){
    const w=$('#tkList');
    w.innerHTML=`<table><thead><tr><th>Name</th><th>Initials</th><th class="num">Rate</th><th></th></tr></thead><tbody>`+
      DB.timekeepers.map(t=>`<tr data-id="${t.id}">
        <td><input class="tk_name" value="${esc(t.name)}"></td>
        <td><input class="tk_init" value="${esc(t.initials)}" style="max-width:90px"></td>
        <td class="num"><input type="number" class="tk_rate" value="${t.rate}" step="5" style="max-width:110px"></td>
        <td class="right"><button class="btn ghost sm tk_del">✕</button></td></tr>`).join('')+`</tbody></table>`;
    w.querySelectorAll('tr[data-id]').forEach(r=>{
      const t=tkById(r.dataset.id);
      r.querySelector('.tk_name').oninput=e=>{ t.name=e.target.value; save(); };
      r.querySelector('.tk_init').oninput=e=>{ t.initials=e.target.value; save(); };
      r.querySelector('.tk_rate').oninput=e=>{ t.rate=Number(e.target.value)||0; save(); };
      r.querySelector('.tk_del').onclick=()=>{ if(DB.timekeepers.length<=1){ alert('Keep at least one timekeeper.'); return; } DB.timekeepers=DB.timekeepers.filter(x=>x.id!==t.id); save(); drawTk(); };
    });
  }
}
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='legal-billing-backup-'+todayISO()+'.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importData(ev){
  const file=ev.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const data=JSON.parse(rd.result); if(!data.firm||!data.clients){ throw new Error('Not a valid backup.'); }
    if(confirm('Replace all current data with this backup?')){ DB=data; save(); render(); } }
    catch(e){ alert('Import failed: '+e.message); } };
  rd.readAsText(file);
}

/* =========================================================================
   MODAL + DOC infra
   ========================================================================= */
function openModal(title, buildBody, onSave, extra, saveLabel){
  const host=$('#modalHost');
  const extraBtns=(extra?.buttons||[]).map((b,i)=>`<button class="btn ${b.cls||'sec'}" data-xb="${i}">${esc(b.label)}</button>`).join('');
  host.innerHTML=`<div class="modal-bg"><div class="modal ${title.length>40?'wide':''}">
    <div class="mh"><h3>${esc(title)}</h3><button class="x" id="mX">×</button></div>
    <div class="mb" id="mBody"></div>
    <div class="mf">
      ${extra?.delete?`<button class="btn danger" id="mDel" style="margin-right:auto">Delete</button>`:''}
      <button class="btn sec" id="mCancel">Cancel</button>
      ${extraBtns}
      <button class="btn" id="mSave">${esc(saveLabel||'Save')}</button>
    </div></div></div>`;
  const body=$('#mBody'); buildBody(body);
  $('#mX').onclick=closeModal; $('#mCancel').onclick=closeModal;
  // Intentionally NOT closing on backdrop click — prevents accidental loss of a half-entered form.
  $('#mSave').onclick=()=>{ if(onSave()!==false) closeModal(); };
  if(extra?.delete) $('#mDel').onclick=extra.delete;
  (extra?.buttons||[]).forEach((b,i)=>{ const el=host.querySelector(`[data-xb="${i}"]`); if(el) el.onclick=()=>b.onClick(); });
}
function closeModal(){ $('#modalHost').innerHTML=''; }

function showDoc(html){
  $('#main').style.display='none'; $('#side').style.display='';
  const w=$('#docwrap'); w.innerHTML=html; w.classList.add('show'); window.scrollTo(0,0);
}
function hideDoc(){ const w=$('#docwrap'); w.classList.remove('show'); w.innerHTML=''; $('#main').style.display=''; }

/* ---------- boot ---------- */
render();
</script>
